name: Lint

on:
  workflow_call:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python project
        run: uv sync --project backend --locked
      - name: Lint Python and shared skill scripts
        run: uv run --directory backend ruff check --config pyproject.toml . ../.agents/skills ../.claude/skills

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm lint:frontend

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Lint Markdown
        run: pnpm lint:markdown
