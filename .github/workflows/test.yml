name: Test

on:
  workflow_call:
    inputs:
      backend:
        type: boolean
        required: true
      frontend:
        type: boolean
        required: true
      workflow-sync:
        type: boolean
        required: true

jobs:
  backend:
    name: Backend
    if: ${{ inputs.backend }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python project
        run: uv sync --locked
      - name: Test Python (includes shared workflow sync)
        run: uv run pytest

  workflow-sync:
    name: Shared workflow sync
    if: ${{ inputs.workflow-sync && !inputs.backend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python project
        run: uv sync --project backend --locked
      - name: Check skills, agents and workspace commands only
        run: uv run --directory backend pytest tests/test_project_workflow_sync.py

  frontend:
    name: Frontend
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @invimport/frontend typecheck
      - name: Test
        run: pnpm --filter @invimport/frontend test
      - name: Build
        run: pnpm --filter @invimport/frontend build
