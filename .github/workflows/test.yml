name: Test

on:
  workflow_call:
    inputs:
      backend:
        type: boolean
        required: true
      frontend:
        type: boolean
        required: true
      workflow-sync:
        type: boolean
        required: true
      intake:
        type: boolean
        required: true

jobs:
  backend:
    name: Backend
    if: ${{ inputs.backend }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python project
        run: uv sync --locked
      - name: Test Python (includes shared workflow sync)
        run: uv run pytest

  workflow-sync:
    name: Shared workflow sync
    if: ${{ inputs.workflow-sync && !inputs.backend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python project
        run: uv sync --project backend --locked
      - name: Check skills, agents and workspace commands only
        run: uv run --directory backend pytest tests/test_project_workflow_sync.py

  frontend:
    name: Frontend
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @invimport/frontend typecheck
      - name: Test
        run: pnpm --filter @invimport/frontend test
      - name: Build
        run: pnpm --filter @invimport/frontend build

  intake:
    name: Intake contracts and HTTP
    if: ${{ inputs.intake }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Contract generation drift
        run: pnpm --filter @invimport/contracts check:generated
      - name: Typecheck contracts
        run: pnpm --filter @invimport/contracts typecheck
      - name: Typecheck server
        run: pnpm --filter @invimport/intake-server typecheck
      - name: Test contracts
        run: pnpm --filter @invimport/contracts test
      - name: Test public HTTP and protected-target boundaries
        run: pnpm --filter @invimport/intake-server test

  intake-pg:
    name: Intake PostgreSQL and process
    if: ${{ inputs.intake }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-owned-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --cpus 1 --memory 512m --pids-limit 128
    env:
      INTAKE_TEST_ADMIN_URL: postgresql://postgres:ci-owned-disposable-only@127.0.0.1:5432/postgres
      INTAKE_TEST_ALLOW_CREATE_DATABASE: owned-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Test reviewed migrations, transactions, grants and exact bytes
        run: pnpm --filter @invimport/intake-server test:pg
      - name: Qualify DBOS public API across actual worker crash and version changes
        run: pnpm --filter @invimport/intake-server test:process
