name: CI

on:
  push:
    branches: [main, interactive-app]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend/test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python project
        run: uv sync --locked
      - name: Test Python (includes shared workflow sync)
        run: uv run pytest

  frontend:
    name: frontend/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test:frontend
      - name: Build
        run: pnpm build

  lint-backend:
    name: backend/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python project
        run: uv sync --project backend --locked
      - name: Lint Python and shared skill scripts
        run: uv run --directory backend ruff check --config pyproject.toml . ../.agents/skills ../.claude/skills

  lint-frontend:
    name: frontend/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm lint:frontend

  lint-markdown:
    name: markdown/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Lint Markdown
        run: pnpm lint:markdown

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: ${{ always() }}
    steps:
      - name: Require all blocking jobs to succeed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: test "$BACKEND_RESULT" = success && test "$FRONTEND_RESULT" = success
