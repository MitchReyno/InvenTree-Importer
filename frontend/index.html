<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A local file intake scaffold for InvenTree Importer." />
    <title>Intake · InvenTree Importer</title>
    <script>
      // Sets the theme, masthead style and masthead motion before first paint;
      // frontend/src/theme/theme.ts, masthead-style.ts and masthead-motion.ts own them afterwards.
      var choice = null
      var masthead = null
      var motion = null
      try {
        choice = localStorage.getItem('bench-intake.theme')
        masthead = localStorage.getItem('bench-intake.masthead')
        motion = localStorage.getItem('bench-intake.masthead-motion')
      } catch (error) {}
      var prefersDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches
      var dark = choice === 'dark' || (choice !== 'light' && prefersDark)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      document.documentElement.dataset.masthead =
        masthead === 'window' || masthead === 'fade' ? masthead : 'bar'
      document.documentElement.dataset.mastheadMotion = motion === 'off' ? 'off' : 'on'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
