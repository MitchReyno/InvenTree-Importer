# Layer over host.compose.yaml for an installation with provisioned actor/target and runtime roles.
services:
  api:
    env_file: ["${INTAKE_API_RUNTIME_ENV:?provide the private API runtime env file}"]
    environment:
      INTAKE_PROCESSING_PROFILE: shared-vm-agent/1

  coordinator:
    image: ${INTAKE_APP_IMAGE:?select the ARM64 app image}
    platform: linux/arm64
    pull_policy: never
    command: [node, --import, tsx, src/agents/session-worker-main.ts]
    depends_on:
      provision: {condition: service_completed_successfully}
      api: {condition: service_started}
    network_mode: service:database
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    env_file: ["${INTAKE_COORDINATOR_ENV:?provide the private worker runtime env file}"]
    environment:
      INTAKE_PROCESSING_PROFILE: shared-vm-agent/1
      INTAKE_AGENT_STATE_ROOT: /var/lib/intake/agent
      INTAKE_BLOB_ROOT: /var/lib/intake/blobs/store
      INTAKE_VM_PAIR: /run/bench-pair
      INTAKE_VM_PORT: "14313"
    volumes:
      - coordinator-state:/var/lib/intake/agent
      - blobs:/var/lib/intake/blobs
      - type: bind
        source: ${INTAKE_COORDINATOR_PAIR:?provide the private coordinator pairing directory}
        target: /run/bench-pair
        read_only: true
        bind:
          create_host_path: false
volumes:
  coordinator-state: {}
