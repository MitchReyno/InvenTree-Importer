# Part categories, mirroring the InvenTree tree.
#
# Nesting is the category hierarchy. Any key that is not one of the reserved
# properties below is a subcategory.
#
#   identity        how a Part in this category is identified:
#                     spec - a specification you would accept any brand of
#                            (passives). Matched on key_parameters.
#                     mpn  - the manufacturer part number IS the spec
#                            (semiconductors, ICs, connectors). Matched on MPN.
#   key_parameters  for identity: spec, the parameters whose values decide
#                   whether two parts are the same part
#   name            template for a generated part name, filled from parameters
#   parameters      parameters that apply to parts here. Inherited by
#                   subcategories and EXTENDED, not replaced.
#   aliases         full DigiKey category paths that map here
#   description     category description in InvenTree
#   structural      category holds no parts directly, only subcategories
#
# identity/key_parameters/name are inherited by subcategories too.
#
# Seeded from the InvenTree instance. Aliases accumulate as DigiKey paths are
# mapped - `invimport categories --learn` writes them back here.

Capacitors:
  identity: spec
  key_parameters:
    - Capacitance
    - Tolerance
    - Max Working Voltage
    - Package
  name: "Capacitor {Capacitance} {Tolerance}% {Max Working Voltage}V {Package}"
  parameters:
    - Capacitance
    - Max Working Voltage
    - Mounting
    - Operating Temp Max
    - Operating Temp Min
    - Package
    - Tolerance
  Ceramic Capacitors:
    aliases:
      - Capacitors / Ceramic Capacitors
  Electrolytic Capacitors:
    parameters:
      - ESR
      - Polarity
    aliases:
      - Capacitors / Aluminum Electrolytic Capacitors
  Film Capacitors:
    aliases:
      - Capacitors / Film Capacitors

Diodes:
  identity: mpn
  parameters:
    - Max Working Voltage
    - Mounting
    - Operating Temp Max
    - Operating Temp Min
    - Package
  Schottky Diodes: {}
  Signal Diodes:
    aliases:
      - Discrete Semiconductor Products / Diodes / Rectifiers / Single Diodes
  Zener Diodes:
    aliases:
      - Discrete Semiconductor Products / Diodes / Zener / Single Zener Diodes

Inductors:
  identity: spec
  key_parameters:
    - Tolerance
    - Package
  name: "Inductor {Tolerance}% {Package}"
  parameters:
    - Mounting
    - Operating Temp Max
    - Operating Temp Min
    - Package
    - Tolerance

Integrated Circuits:
  identity: mpn
  parameters:
    - Mounting
    - Operating Temp Max
    - Operating Temp Min
    - Package
  Memory: {}
  Op-Amps:
    aliases:
      - Integrated Circuits (ICs) / Linear / Amplifiers / Instrumentation, Op Amps, Buffer Amps
  Power Management:
    Power Converters/Controllers:
      aliases:
        - Integrated Circuits (ICs) / Power Management (PMIC) / Voltage Regulators - DC DC Switching Regulators
    Voltage References:
      aliases:
        - Integrated Circuits (ICs) / Power Management (PMIC) / Voltage Reference
    Voltage Regulators:
      aliases:
        - Integrated Circuits (ICs) / Power Management (PMIC) / Voltage Regulators - Linear, Low Drop Out (LDO) Regulators

Optoelectronics:
  identity: mpn
  parameters:
    - Mounting
    - Operating Temp Max
    - Operating Temp Min
    - Package
  Discrete LEDs: {}
  Graphical Displays: {}
  LED Displays & Indicators: {}

Potentiometers:
  identity: mpn
  parameters:
    - Mounting
    - Operating Temp Max
    - Operating Temp Min
    - Package
    - Resistance
    - Tolerance
  Rotary Potentiometers:
    aliases:
      - Potentiometers, Variable Resistors / Rotary Potentiometers, Rheostats
  Slide Potentiometers: {}
  Trimpots:
    aliases:
      - Potentiometers, Variable Resistors / Trimmer Potentiometers

Resistors:
  identity: spec
  key_parameters:
    - Resistance
    - Tolerance
    - Power Rating
    - Composition
    - Package
  name: "Resistor {Resistance} {Tolerance}% {Power Rating}W {Composition} {Package}"
  parameters:
    - Composition
    - Max Working Voltage
    - Mounting
    - Operating Temp Max
    - Operating Temp Min
    - Package
    - Power Rating
    - Resistance
    - Temperature Coefficient
    - Tolerance
  aliases:
    - Resistors / Through Hole Resistors
    - Resistors / Chip Resistor - Surface Mount

Switches:
  identity: mpn
  parameters:
    - Mounting
    - Package
  DIP Switches: {}
  Push Buttons:
    aliases:
      - Switches / Pushbutton Switches
  Slide Switches:
    aliases:
      - Switches / Slide Switches
  Throw Switches: {}

Transistors:
  identity: mpn
  parameters:
    - Max Working Voltage
    - Mounting
    - Operating Temp Max
    - Operating Temp Min
    - Package
    - Power Rating
  BJTs: {}
  JFETs: {}
  MOSFETs: {}
