# Part categories, mirroring the InvenTree tree.
#
# Nesting is the category hierarchy. Any key that is not one of the reserved
# properties below is a subcategory.
#
#   ipn_prefix      prefix for generated IPNs: RES-00042, IC-00117. Set it on
#                   a top-level category and every subcategory numbers under
#                   it; override it on a subcategory that deserves its own
#                   sequence (Potentiometers is POT, Trimpots is TRM).
#                   Categories sharing a prefix share one sequence. A category
#                   with none configured falls back to MISC.
#   identity        how a Part in this category is identified:
#                     spec - a specification you would accept any brand of
#                            (passives). Matched on key_parameters.
#                     mpn  - the manufacturer part number IS the spec
#                            (semiconductors, ICs, connectors). Matched on MPN.
#   key_parameters  for identity: spec, the parameters whose values decide
#                   whether two parts are the same part
#   name            template for a generated part name, filled from parameters
#   parameters      parameters that apply to parts here. Inherited by
#                   subcategories and EXTENDED, not replaced.
#   aliases         full DigiKey category paths that map here
#   description     category description in InvenTree
#   structural      category holds no parts directly, only subcategories.
#                   Defaults to true when this entry has children, false
#                   for a leaf. Set it only to override that.
#
# identity/ipn_prefix/key_parameters/name are inherited by subcategories too.
#
# Seeded from the InvenTree instance. Aliases accumulate as DigiKey paths are
# mapped - `invimport categories --learn` writes them back here.

Capacitors:
  ipn_prefix: CAP
  identity: spec
  key_parameters:
    - Capacitance
    - Tolerance
    - Max Working Voltage
    - Mounting
    - Package
  name: "Capacitor {Capacitance} {Max Working Voltage}V {Tolerance}% {Mounting} {Package}"
  parameters:
    - Capacitance
    - Max Working Voltage
    - Mounting
    - Operating Temp Max
    - Operating Temp Min
    - Package
    - Tolerance
  Ceramic Capacitors:
    name: "Ceramic Capacitor {Capacitance} {Max Working Voltage}V {Tolerance}% {Mounting} {Package}"
    aliases:
      - Capacitors / Ceramic Capacitors
  Electrolytic Capacitors:
    ignore:
      - Ratings
    name: "Electrolytic Capacitor {Capacitance} {Max Working Voltage}V {Tolerance}% {Mounting} {Package}"
    key_parameters:
      - Polarity
      - Surface Mount Land Size
    parameters:
      - ESR
      - Polarity
      - Diameter
      - Height
      - Lead Spacing
      - "Lifetime @ Temp."
      - "Ripple Current @ Low Frequency"
      - "Ripple Current @ High Frequency"
      - Applications
      - Impedance
      - Surface Mount Land Size
    aliases:
      - Capacitors / Aluminum Electrolytic Capacitors
  Film Capacitors:
    ignore:
      - Ratings
    key_parameters:
      - Dielectric Material
    parameters:
      - Dielectric Material
      - Applications
      - Termination Style
    name: "Film Capacitor {Capacitance} {Max Working Voltage}V {Tolerance}% {Mounting} {Package}"
    aliases:
      - Capacitors / Film Capacitors

  Tantalum Capacitors:
    name: "Tantalum Capacitor {Capacitance} {Max Working Voltage}V {Tolerance}% {Mounting} {Package}"
    parameters:
      - ESR
      - Diameter
      - Height
      - Lead Spacing
      - Features
      - "Lifetime @ Temp."
      - Manufacturer Size Code
    aliases:
      - Capacitors / Tantalum Capacitors
  Motor Capacitors:
    aliases:
      - Capacitors / Motor Start, Motor Run Capacitors (AC)
