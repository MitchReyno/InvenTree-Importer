# Parameter templates, and how to read their values out of supplier data.
#
# Each entry becomes an InvenTree ParameterTemplate. `invimport parameters`
# creates and updates them; nothing is ever deleted.
#
#   units        pint unit the value is stored in. Values are formatted into
#                it with pint's compact short-pretty format - 100000 ohm is
#                stored as "100 kΩ". InvenTree parses that back to derive
#                data_numeric, so readable values still sort and filter.
#   description  shown in the InvenTree UI
#   choices      a fixed value set, comma-joined into the template
#   checkbox     boolean parameter
#   aliases      names the supplier may send this parameter under
#   parse        how to turn the supplier's value text into ours (see
#                invimport/inventree/values.py)
#   prefixes     SI prefixes this parameter is written with, largest first,
#                in both stored values and generated part names. Capacitance
#                uses [u, n, p] so 3300 uF reads "3300u" and stores as
#                "3300 µF" rather than "3.3 mF". "R" (or "") means the
#                unprefixed unit, and is the floor when listed last. Omit to
#                let any prefix be chosen; needs units.
#   name_style   how the value is written in a part name. "rkm" puts the
#                prefix where the decimal point goes - 4R7, 3k3 (IEC 60062).
#                Needs prefixes.
#   values       canonical value -> the supplier spellings that mean it
#
# Seeded from the InvenTree instance, then extended. Units already on the
# server are kept as they are.

Capacitance:
  units: F
  description: Nominal capacitance
  aliases:
    - Capacitance
  parse: quantity
  # Written the way capacitors are written: 3300u, not the 3.3m a free choice
  # of prefix gives, and 100p rather than 0.1n.
  prefixes: [u, n, p]

Composition:
  description: Resistive element material
  aliases:
    - Composition
    - Material
  choices:
    - Metal Film
    - Carbon Film
    - Carbon Composition
    - Wire Wound
    - Thick Film
    - Thin Film
  values:
    Wire Wound:
      - Wire Wound
      - Wirewound

Diameter:
  units: mm
  description: Body or can diameter
  aliases:
    - Size / Dimension
    - Diameter
  # DigiKey writes dimensions imperial-first with the metric equivalent in
  # brackets: 0.197" Dia (5.00mm). `metric_first` reads the bracketed value;
  # taking the leading number would store 0.197 as though it were already mm.
  # A resistor body names two ("0.094" Dia x 0.248" L (2.40mm x 6.30mm)"):
  # this takes the first (Dia), Length takes the last.
  parse: metric_first

Length:
  units: mm
  description: Body length
  aliases:
    - Size / Dimension
    - Length
  # Same DigiKey field as Diameter; the last of the two metric measurements.
  # A single-dimension can ("0.197" Dia (5.00mm)") is not a length.
  parse: metric_last

ESR:
  units: ohm
  description: Equivalent series resistance
  aliases:
    - ESR (Equivalent Series Resistance)
    - Equivalent Series Resistance(ESR)
  parse: quantity

Height:
  units: mm
  description: Seated height above the board
  aliases:
    - Height - Seated (Max)
    - Height
    - Height (Max)
  parse: metric

Inductance:
  units: H
  description: Nominal inductance
  aliases:
    - Inductance
  parse: quantity
  prefixes: [m, u, n]

Lead Spacing:
  units: mm
  description: Distance between lead centres
  aliases:
    - Lead Spacing
    - Lead Pitch
  parse: metric

Max Working Voltage:
  units: V
  description: Maximum continuous working voltage
  aliases:
    - Voltage - Rated
    - Voltage Rating
    - Voltage - Rated (AC)
    - Voltage - Rated (DC)
  parse: quantity

Mounting:
  description: Mounting style
  aliases:
    - Mounting Type
    - Mounting Style
    # DigiKey through-hole resistors omit Mounting Type and only say Axial
    # (or Radial) in Package / Case. The values map already treats those as
    # Through Hole; this alias is how that field is seen.
    - Package / Case
  choices:
    - Through Hole
    - Surface Mount
    - Chassis
  values:
    Through Hole:
      - Through Hole
      - Thru Hole
      - Axial
      - Radial
    Surface Mount:
      - Surface Mount
      - SMD/SMT
      - Surface Mount, MELF

Operating Temp Max:
  units: °C
  description: Maximum rated operating temperature
  aliases:
    - Operating Temperature
  parse: range_high

Operating Temp Min:
  units: °C
  description: Minimum rated operating temperature
  aliases:
    - Operating Temperature
  parse: range_low

Package:
  description: Body or lead style
  aliases:
    - Package / Case
    - Supplier Device Package
  # DigiKey qualifies the can style and the mounting into the package name.
  # Both are recorded elsewhere - Mounting carries through-hole vs SMD - so
  # the package itself reads as just the lead style. Only the "Radial, Can"
  # family is folded: DO-35, TO-92 and the rest name a real package outline
  # and are left exactly as the supplier states them.
  values:
    Radial:
      - Radial
      - Radial, Can
      - Radial, Can - SMD
      - Radial, Can - Snap-In
    Axial:
      - Axial
      - Axial, Can

Polarity:
  description: Polarised or not
  aliases:
    - Polarization
  # Choices are the ones already on the server; the supplier spellings that
  # mean them are mapped below rather than changing existing data.
  choices:
    - Bipolar
    - Polar
  values:
    Bipolar:
      - Bi-Polar
      - Bipolar
    Polar:
      - Polar
      - Polarized
      - Polarised

Power Rating:
  units: W
  description: Maximum continuous power dissipation
  aliases:
    - Power (Watts)
    - Power Rating (Watts)
    - Power - Max
  parse: quantity_first

Resistance:
  units: ohm
  description: Nominal resistance value
  aliases:
    - Resistance
    - Resistance (Ohms)
  parse: quantity
  # Ohms at the bottom - a 0.05 ohm shunt is "0.05 Ω", never "50 mΩ". R is the
  # unprefixed ohm, so the set is really ohms, kilohms and megohms.
  prefixes: [M, k, R]
  # Part names read 4R7 and 3k3 rather than 4.7 and 3.3k.
  name_style: rkm

Temperature Coefficient:
  # pint's own composite - no custom unit needed. Not ppm/°C: degC is an
  # absolute temperature, and a coefficient is per temperature *interval*.
  units: ppm/K
  description: Resistance change with temperature in ppm per degree C
  aliases:
    - Temperature Coefficient
  parse: quantity

Tolerance:
  units: "%"
  description: Component tolerance
  aliases:
    - Tolerance
  parse: percent

Max Forward Voltage Drop:
  units: V
  description: Maximum forward voltage drop
  aliases:
    - Forward Voltage
    - Forward Voltage (Max)
    - Forward Voltage (Max) (Vf)
    - Voltage - Forward (Max) @ If
    - Voltage - Forward (Max) (Vf)
    - Voltage - Forward (Vf) (Max) @ If
  parse: quantity

Max Impedance:
  units: ohm
  description: Maximum impedance
  aliases:
    - Impedance (Max)
    - Impedance (Max) (Zzt)
  parse: quantity

Zener Voltage:
  units: V
  description: Zener voltage
  aliases:
    - Zener Voltage
    - Zener Voltage (Vz)
    - Voltage - Zener
    - Voltage - Zener (Nom)
    - Voltage - Zener (Nom) (Vz)
  parse: quantity

# --------------------------------------------------------------------------
# Connectors
# --------------------------------------------------------------------------
Current Rating:
  units: A
  description: Maximum rated contact current
  aliases:
    - Current Rating (Amps)
    - Current Rating (Max)
  parse: quantity

Connector Type:
  description: Plug, receptacle, header
  aliases:
    - Connector Type

Contact Type:
  description: What the contact itself is
  aliases:
    - Contact Type

Contact Finish:
  description: Plating on the mating surface
  aliases:
    - Contact Finish
    - Contact Finish - Mating

Termination Style:
  description: How the connector attaches to the board or wire
  aliases:
    - Termination Style
    - Termination

# --------------------------------------------------------------------------
# Amplifiers
# --------------------------------------------------------------------------
Gain Bandwidth Product:
  units: Hz
  description: Frequency at which open-loop gain falls to unity
  aliases:
    - Gain Bandwidth Product
  parse: quantity

Slew Rate:
  # V/µs is kept as written rather than compacted to MV/s - see
  # Formatter.compactable().
  units: V/µs
  description: Maximum rate of output voltage change
  aliases:
    - Slew Rate
  parse: quantity

Input Offset Voltage:
  units: V
  description: Differential input voltage needed to null the output
  aliases:
    - Voltage - Input Offset
  parse: quantity

Supply Current:
  units: A
  description: Current drawn from the supply in normal operation
  aliases:
    - Current - Supply
    - Current - Supply (Max)
  parse: quantity

Supply Voltage Min:
  units: V
  description: Minimum supply voltage
  aliases:
    - Voltage - Supply, Single (V+)
    - Voltage - Supply, Single/Dual (±)
    - Voltage - Supply
    - Voltage - Supply (Vcc/Vdd)
    - Voltage - Supply, Analog
    - Voltage - Supply, Digital
    - Supply Voltage
  parse: range_low

Supply Voltage Max:
  units: V
  description: Maximum supply voltage
  aliases:
    - Voltage - Supply, Single (V+)
    - Voltage - Supply, Single/Dual (±)
    - Voltage - Supply
    - Voltage - Supply (Vcc/Vdd)
    - Voltage - Supply, Analog
    - Voltage - Supply, Digital
    - Supply Voltage
  parse: range_high

# --------------------------------------------------------------------------
# Power management
# --------------------------------------------------------------------------
Input Voltage Min:
  units: V
  description: Minimum usable input supply voltage
  aliases:
    - Voltage - Input (Min)
  parse: quantity

Input Voltage Max:
  units: V
  description: Maximum usable input supply voltage
  aliases:
    - Voltage - Input (Max)
  parse: quantity

Output Voltage Min:
  units: V
  description: Output voltage, or the low end of an adjustable range
  aliases:
    - Voltage - Output (Min/Fixed)
  parse: quantity

Output Voltage Max:
  units: V
  description: High end of an adjustable output range
  aliases:
    - Voltage - Output (Max)
  parse: quantity

Output Current:
  units: A
  description: Maximum current the output can source
  aliases:
    - Current - Output
    - Current - Output / Channel
  parse: quantity

Quiescent Current:
  units: A
  description: Current drawn with no load
  aliases:
    - Current - Quiescent (Iq)
    - Current - Quiescent (Max)
  parse: quantity

# --------------------------------------------------------------------------
# Crystals and oscillators
# --------------------------------------------------------------------------
Frequency:
  units: Hz
  description: Nominal operating frequency
  aliases:
    - Frequency
  parse: quantity

Load Capacitance:
  units: F
  description: Capacitance the crystal is specified against
  aliases:
    - Load Capacitance
  parse: quantity
