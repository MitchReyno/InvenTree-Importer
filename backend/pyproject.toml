[project]
name = "inventree-importer"
version = "0.1.0"
description = "Import DigiKey product and order data into InvenTree"
# Only 3.12 is tested. The code uses `from __future__ import annotations`
# throughout and would likely run on 3.10+, but that is unverified.
requires-python = ">=3.12"
dependencies = [
    "inquirerpy>=0.3.4",
    # Upper bound is deliberate. src/invimport/inventree/api.py overrides
    # Parameter.URL and ParameterTemplate.URL because 0.13.x still ships the
    # pre-530 /api/part/parameter/ routes. If a later release fixes those
    # upstream, the override stops being a fix and becomes the bug - so pin
    # until it can be retested. test_client_models_point_at_the_530_routes
    # covers the override itself.
    "inventree>=0.13.5,<0.14",
    "pint>=0.25.3",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# Only scripts/register-scans.py needs these, and only on a machine with the
# scanner attached, so they stay out of the default install: `uv sync --extra
# scanner`. pyserial covers the Virtual COM path, bleak the BLE one,
# textual the live TUI, pynput the HID-style keyboard wedge.
scanner = [
    "pyserial>=3.5",
    "bleak>=3.0.2",
    "textual>=8.2.8",
    "pynput>=1.8.2",
]

[project.scripts]
invimport = "invimport.__main__:cli"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution is named inventree-importer but the package is invimport,
# so the backend cannot infer it.
packages = ["src/invimport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The TUI tests are the slow part of the suite and only exercise the scanner
# script, so they are opt-in: `pytest -m tui` for those, `pytest -m ""` for all.
addopts = "-q -m 'not tui'"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "tui: drives the register-scans Textual UI; slow, and needs the scanner extra",
]

[tool.ruff]
target-version = "py312"
src = ["src"]
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
# Pyflakes and bugbear only: the checks that find real mistakes - unused or
# shadowed names, a raise that hides its cause, a zip that silently truncates.
# Style is left to the surrounding code.
select = ["F", "B"]
