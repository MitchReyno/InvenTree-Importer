schema: bench-intake

context: |
  Bench Intake planning is repository-owned. The functionality index owns current
  BI item metadata and links directly to OpenSpec changes for detail. Each change
  has a short descriptive kebab-case name that appears in every delivering branch
  and commit/PR subject. Preserve user scope and existing authorization. No schema
  grants provider, inventory, deployment or external messaging authority.

operations:
  apply:
    guidance:
      - Use the owning project's declared checks and required independent exact-head review; keep merge tasks pending during a user hold.
      - Check completed actions before committing their completed work and include the task-file update in the same commit; retain current item status only.
  archive:
    guidance:
      - Check implementation and acceptance evidence before describing a linked BI item as Done; archive state alone is insufficient.
      - Update the functionality index links if the authorized archive moves the referenced change.
