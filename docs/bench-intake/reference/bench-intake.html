<meta charset="utf-8">
<title>Bench Intake Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working tool. Prototype controls on a thin top bar; the app sits in a frame that can be desktop-wide or phone-sized (container queries drive the app's responsive rules). */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eaeee9; --line:#d5dbd4; --line-strong:#b9c2b8;
  --fg:#1b211d; --muted:#5a645c; --accent:#28598a; --accent-weak:#e2ebf4; --on-accent:#ffffff;
  --ok:#2c7448; --ok-weak:#e0f0e5; --warn:#8d5a00; --warn-weak:#fbefd6; --bad:#a8271f; --bad-weak:#fbe4e1;
  --info:#5a4a9a; --info-weak:#ebe7f7; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
  --overlay:rgba(18,24,20,.55); --bar:#20282a; --bar-fg:#dfe6e3;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131715; --surface:#1a1f1c; --surface-2:#222824; --line:#323a35; --line-strong:#47514a;
  --fg:#e5eae6; --muted:#9ba69e; --accent:#82b2e2; --accent-weak:#1d2b39; --on-accent:#0d1620;
  --ok:#74c492; --ok-weak:#1a2e21; --warn:#e3b452; --warn-weak:#33280f; --bad:#f2918a; --bad-weak:#3a1c1a;
  --info:#b4a6ee; --info-weak:#272140; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  --overlay:rgba(0,0,0,.65); --bar:#0c0f0e; --bar-fg:#c9d2ce; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131715; --surface:#1a1f1c; --surface-2:#222824; --line:#323a35; --line-strong:#47514a;
  --fg:#e5eae6; --muted:#9ba69e; --accent:#82b2e2; --accent-weak:#1d2b39; --on-accent:#0d1620;
  --ok:#74c492; --ok-weak:#1a2e21; --warn:#e3b452; --warn-weak:#33280f; --bad:#f2918a; --bad-weak:#3a1c1a;
  --info:#b4a6ee; --info-weak:#272140; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  --overlay:rgba(0,0,0,.65); --bar:#0c0f0e; --bar-fg:#c9d2ce; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:20px;font-weight:650}
h2{font-size:16px;font-weight:650}
h3{font-size:14px;font-weight:650}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* prototype bar */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar);color:var(--bar-fg);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bar)}
.pbar b{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11px;opacity:.8}
.pbar .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pbar button,.pbar select{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--bar-fg);border-radius:6px;padding:3px 9px;cursor:pointer}
.pbar button[aria-pressed="true"]{background:var(--bar-fg);color:var(--bar);border-color:var(--bar-fg)}
.pbar select option{color:#111}
.pbar .sp{flex:1}

/* frame */
.stage{padding-block:0;}
#frame{margin:0 auto;background:var(--bg)}
#frame.phone{width:390px;max-width:100%;height:min(820px,calc(100dvh - 90px));overflow:auto;margin-top:18px;margin-bottom:18px;
  border:10px solid var(--bar);border-radius:34px;transform:translateZ(0);box-shadow:0 10px 40px rgba(0,0,0,.25)}
#app{container:app / inline-size;min-height:100%;position:relative}

/* app header */
.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer}
.brand .logo{width:22px;height:22px;border-radius:5px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font-size:12px;font-family:var(--mono)}
.crumb{color:var(--muted);display:flex;gap:6px;align-items:center;min-width:0}
.crumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.conn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.bad{background:var(--bad)}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:18px 40px;max-width:1500px;margin:0 auto}

/* batch header + tabs */
.bhead{background:var(--surface);border-bottom:1px solid var(--line)}
.bhead .in{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;padding-block:12px 0;max-width:1500px;margin:0 auto}
.bhead .title{flex:1 1 320px;min-width:0;padding-bottom:10px}
.bhead .counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:9px 12px 10px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-size:11.5px;background:var(--surface-2);border-radius:10px;padding:1px 7px;margin-left:4px;color:var(--muted)}
.tab[disabled]{opacity:.45;cursor:not-allowed}

/* generic */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.lg{padding:12px 16px;font-size:15px}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec{padding:14px 16px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.sp{flex:1}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.45}
.field-label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}

/* status pills — icon + text, colour is secondary */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 7px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.pill i{font-style:normal;font-size:11px;width:14px;text-align:center}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.bad{background:var(--bad-weak);color:var(--bad)}
.pill.info{background:var(--info-weak);color:var(--info)}
.pill.acc{background:var(--accent-weak);color:var(--accent)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.outline{background:transparent;border-color:var(--line-strong);color:var(--muted)}

/* banners */
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.banner .ic{font-weight:700;width:20px;text-align:center;flex:none}
.banner.warn{background:var(--warn-weak);border-color:transparent}
.banner.warn .ic{color:var(--warn)}
.banner.bad{background:var(--bad-weak);border-color:transparent}
.banner.bad .ic{color:var(--bad)}
.banner.info{background:var(--accent-weak);border-color:transparent}
.banner.info .ic{color:var(--accent)}
.banner.ok{background:var(--ok-weak);border-color:transparent}
.banner.ok .ic{color:var(--ok)}

/* photos */
.ph{display:block;width:100%;height:100%;background:#3b4a46}
.thumb{width:56px;height:42px;border-radius:5px;overflow:hidden;flex:none;border:1px solid var(--line)}
.thumb svg{display:block;width:100%;height:100%}

/* inbox */
.inbox{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.continue{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0;overflow:hidden}
.continue .img{min-height:150px}
.continue .body{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.blist{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.brow:first-child{border-top:0}
.brow:hover{background:var(--surface-2)}
.brow .thumb{width:72px;height:54px}
.brow .meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12.5px;margin-top:3px}
.brow .right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.bar2{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);width:120px}
.bar2 span{display:block;height:100%}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.3s infinite linear;border-radius:5px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty .big{width:72px;height:72px;border-radius:16px;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font-size:30px}

/* capture */
.capture{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;max-width:1240px;margin:0 auto;align-items:start}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.capbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.capbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;position:relative}
.capbtn .gl{font-size:22px;line-height:1;color:var(--accent)}
.capbtn small{font-weight:400;color:var(--muted);font-size:11.5px}
.capbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.capbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ev{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface);padding:0;text-align:left;display:flex;flex-direction:column}
.ev[draggable="true"]{cursor:grab}
.ev.picked{outline:2px solid var(--accent);outline-offset:1px}
.ev .evimg{display:block;padding:0;border:0;background:var(--surface-2);width:100%;cursor:zoom-in}
.ev .pick{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);border-radius:4px;padding:3px 5px;display:flex;cursor:pointer}
.ev .pick input{margin:0;width:16px;height:16px;cursor:pointer}
.ev .enote{padding:0 6px 6px;font-size:12px}
.ev .enote p{margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev .enote textarea{min-height:60px;font-size:12px;padding:5px 6px}
.egroups{display:flex;flex-direction:column;gap:10px}
.egroup{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.egroup.ungrouped{border-style:dashed;background:transparent}
.egroup.over{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.ghead{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ghead .gname{flex:1 1 100%;width:auto;font-weight:650;border-color:transparent;background:transparent;padding:4px 6px;margin-left:-6px}
.ghead .gname:hover,.ghead .gname:focus{border-color:var(--line-strong);background:var(--surface)}
.gnote{min-height:54px;font-size:13px}
.filebtn{position:relative}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.evnotes{background:var(--surface-2);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.evnotes .label{margin-right:4px}
.capbar{position:sticky;bottom:8px;margin:0;z-index:4}
.ev .im{aspect-ratio:4/3;max-width:100%}
.ev .im svg{width:100%;height:100%;display:block}
.ev .cap{font-size:11.5px;padding:4px 6px;display:flex;justify-content:space-between;gap:4px;background:var(--surface)}
.ev .cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .tag{position:absolute;top:4px;left:4px;font-size:10.5px;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:1px 5px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:2px 9px;font-size:12px}
.sticky-foot{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inbox-foot{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}

/* processing */
.proc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;max-width:1240px;margin:0 auto;align-items:start}
.phase{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.phase:first-child{border-top:0}
.phase .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line-strong);color:var(--muted)}
.phase.done .st{background:var(--ok-weak);border-color:var(--ok);color:var(--ok)}
.phase.run .st{border-color:var(--accent);color:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--accent-weak)}}
.phase .out{font-size:12.5px;color:var(--muted);margin-top:2px}
.ticks{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.ticks span{width:14px;height:6px;border-radius:2px;background:var(--surface-2)}
.ticks span.on{background:var(--accent)}
.ticks span.okk{background:var(--ok)}
.qcard{border:1px solid var(--warn);border-radius:var(--r);background:var(--surface);overflow:hidden}
.qcard .qh{background:var(--warn-weak);padding:10px 14px;display:flex;gap:8px;align-items:flex-start}
.qcard .qh .ic{color:var(--warn);font-weight:700}
.qcard .qb{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.closeups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.closeups .c{border-radius:6px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;max-width:100%;position:relative}
.closeups .c svg{width:100%;height:100%;display:block}
.closeups .c .lab{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;padding:9px 11px;border:1px solid var(--line-strong);border-radius:7px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.opt input{margin-top:3px}

/* review */
.rv-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.fbtn[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.split{display:grid;grid-template-columns:260px minmax(0,1fr) minmax(380px,520px);gap:12px;height:calc(100dvh - 232px);min-height:560px}
.col{min-height:0;overflow:auto;display:flex;flex-direction:column}
.ilist{padding:4px}
.irow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:9px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%}
.irow:hover{background:var(--surface-2)}
.irow[aria-current="true"]{background:var(--accent-weak);border-color:var(--accent)}
.irow .thumb{width:48px;height:38px}
.irow .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .s{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.igroup{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 8px 4px}
.evpane{display:flex;flex-direction:column;gap:8px;padding:10px}
.evmain{position:relative;border-radius:7px;overflow:hidden;background:#2f3b38;aspect-ratio:4/3;max-width:100%}
.evmain svg{width:100%;height:100%;display:block}
.evstrip{display:flex;gap:6px;flex-wrap:wrap}
.evstrip button{padding:0;border:2px solid transparent;border-radius:6px;background:none;cursor:pointer}
.evstrip button[aria-pressed="true"]{border-color:var(--accent)}
.detail{display:flex;flex-direction:column;min-height:0}
.detail .scroll{overflow:auto;flex:1;min-height:0}
.dhead{padding:12px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 10px;align-items:start}
.kv>dt{color:var(--muted);font-size:12.5px;padding-top:5px}
.kv>dd{margin:0;min-width:0}
dl{margin:0}
.val{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:3px 6px;margin:0 -6px;border-radius:5px;border:1px solid transparent;cursor:text;background:none;text-align:left;width:calc(100% + 12px)}
.val:hover{border-color:var(--line);background:var(--surface-2)}
.val .v{font-weight:500;overflow-wrap:anywhere}
.val .v.mono{font-weight:500}
.val.edited .v{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
.val.override .v::after{content:" · overrides batch";font-weight:400;font-size:12px;color:var(--warn)}
.val.inherited .v::after{content:" · from batch";font-weight:400;font-size:12px;color:var(--muted)}
.src{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface);cursor:pointer;white-space:nowrap;line-height:1.6}
.src:hover{border-color:var(--accent);color:var(--accent)}
.src.likely{border-color:var(--warn);color:var(--warn)}
.src.conflict{border-color:var(--bad);color:var(--bad)}
.src.user{border-color:var(--accent);color:var(--accent)}
.editrow{display:flex;gap:6px;align-items:center}
.editrow input{flex:1}
.partbox{border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.partbox.new{border-style:dashed;border-color:var(--info)}
.partbox.reuse{border-color:var(--ok)}
.dfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.instr{display:flex;gap:6px}
.instr input{flex:1}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}
.outputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.outp{border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;background:var(--surface);padding:0;text-align:left}
.outp .im{aspect-ratio:1;max-width:100%;background:#2f3b38}
.outp .im svg{width:100%;height:100%;display:block}
.outp .cap{padding:5px 7px;font-size:11.5px;display:flex;flex-direction:column;gap:1px}
.outp.flag{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
.doc{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.doc .ico{width:26px;height:32px;border:1px solid var(--line-strong);border-radius:3px;display:grid;place-items:center;font-size:9px;font-family:var(--mono);color:var(--bad);flex:none}
.recheck{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--accent-weak);color:var(--accent);font-size:12.5px}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;display:inline-block;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.more{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-size:12.5px}

/* table view */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.sel td{background:var(--accent-weak)}
tr.cur td{box-shadow:inset 0 0 0 0 transparent}
tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td .cell{border:1px solid transparent;border-radius:4px;padding:3px 5px;background:none;cursor:text;text-align:left;width:100%;display:block}
td .cell:hover{border-color:var(--line-strong)}
td .cell.ov{color:var(--warn);font-weight:600}
td .cell.ov::before{content:"◆ ";font-size:9px}
td .cell.ed{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--fg);color:var(--bg);border-radius:var(--r);margin-bottom:10px}
.bulk select,.bulk input{width:auto;background:var(--bg);color:var(--fg);border-color:transparent;padding:4px 7px}
.bulk .btn{background:var(--bg);color:var(--fg);border-color:transparent}

/* approve */
.appr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;max-width:1240px;margin:0 auto;align-items:start}
.alist .arow{display:grid;grid-template-columns:22px 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}

.alist .arow.dim{opacity:.7}
.sumsec{padding:12px 16px;border-top:1px solid var(--line)}
.sumsec:first-child{border-top:0}

.sumsec h3 .c{font-family:var(--mono);font-size:13px;color:var(--muted)}
.sumsec ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.sumsec li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.shared{border-left:2px solid var(--info);padding-left:10px;margin-top:4px;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.approve-foot{position:sticky;bottom:0;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;box-shadow:var(--shadow)}

/* results */
.results{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.outcome{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.outcome .big{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.rrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 16px;border-top:1px solid var(--line)}
.rrow .sub{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin-top:2px}
.rrow .sub .att{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.okc{color:var(--ok);font-weight:700}
.badc{color:var(--bad);font-weight:700}
.warnc{color:var(--warn);font-weight:700}
details.act{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.act summary{padding:10px 14px;cursor:pointer;font-weight:600}
.log{font-family:var(--mono);font-size:12px;padding:0 14px 12px;display:flex;flex-direction:column;gap:3px;overflow-x:auto}
.log div{white-space:pre}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}

.dialog .db{overflow:auto;min-height:0}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
.vstage{background:#232c2a;overflow:auto;display:flex;align-items:center;justify-content:center;min-height:420px;position:relative;padding:20px}
.vstage .canvas{transition:transform .2s;transform-origin:center;max-width:100%}
.vstage svg{display:block;width:min(720px,100%);height:auto}
.vtools{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.vside{border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.vside .sec{padding:12px 14px}
.preview{width:100%;aspect-ratio:1;max-width:100%;border-radius:6px;overflow:hidden;background:#2f3b38;border:1px solid var(--line)}
.preview svg{width:100%;height:100%;display:block;transition:transform .2s}
.assign{display:flex;flex-direction:column;gap:4px}
.assign label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.vstrip{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);overflow-x:auto}
.cmp{width:100%;min-width:720px}
.cmp th,.cmp td{vertical-align:top;padding:8px 12px}
.cmp td.diff{background:var(--warn-weak)}
.cmp td.diff::before{content:"≠ ";color:var(--warn);font-weight:700}
.cmp td.same::before{content:"= ";color:var(--ok);font-weight:700}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:60;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}

/* notes */
.notes{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.notes p,.notes li{max-width:68ch}
.notes .card{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ia{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ia div{border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--surface-2)}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vs>div{border:1px solid var(--line);border-radius:7px;padding:12px}

.cmpt{width:100%;border-collapse:collapse;min-width:0}

.valbtn{all:unset;cursor:text;flex:1 1 auto;min-width:0}
.valbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
/* record levels */
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 16px 12px}
.chain .arrow{color:var(--muted);font-size:12px}
.link-chip{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 7px;cursor:pointer;line-height:1.3;text-align:left}

.link-chip.st-new{border-style:dashed;border-color:var(--info)} .link-chip.st-new .ls{color:var(--info)}
.link-chip.st-update{border-color:var(--accent)} .link-chip.st-update .ls{color:var(--accent)}
.link-chip.st-choose{border-color:var(--warn)} .link-chip.st-choose .ls{color:var(--warn)}
.link-chip.st-none .ls,.link-chip.st-off .ls{color:var(--muted)}
.rec{border-top:1px solid var(--line)}

.rec.st-new>.rech{box-shadow:inset 3px 0 0 var(--info)}
.rec.st-update>.rech{box-shadow:inset 3px 0 0 var(--accent)}
.rec.st-choose>.rech{box-shadow:inset 3px 0 0 var(--warn)}
.recb{padding:2px 16px 14px;display:flex;flex-direction:column;gap:10px}
.subh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{display:inline-flex;font-size:11.5px;border-radius:4px;padding:0 5px;white-space:nowrap;line-height:1.6}
.tag.same{color:var(--ok)}
.tag.add{color:var(--info);border:1px dashed var(--info)}
.diffbox{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.diffbox.ow{border-color:var(--warn)}
.diffbox .dl{display:grid;grid-template-columns:82px minmax(0,1fr);gap:6px;align-items:baseline}
.diffbox .dk{font-size:11.5px;color:var(--muted)}
.strike{text-decoration:line-through;color:var(--muted)}
.seg.sm button{padding:3px 8px;font-size:12px}
.note-new{color:var(--info);margin:0}
/* images */
.imcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.imcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}

.imh{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}

.srcim svg{width:100%;height:100%;display:block}
.wipe{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#2f3b38;max-width:100%}
.wl{position:absolute;inset:0}

.vers{display:flex;flex-direction:column;gap:6px;border:1px solid var(--warn);border-radius:6px;padding:8px}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.vim{aspect-ratio:1;background:#e8ebe6;border-radius:5px;overflow:hidden;max-width:100%}

.vgrid figcaption{font-size:11.5px;color:var(--muted)}
.fbform{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}

/* evidence map */
.mapcard{max-width:1240px;margin:18px auto 0}

.mgh{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 2px 0}

.mcell{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;font-family:var(--mono);font-size:11px;padding:1px 4px;cursor:pointer;white-space:nowrap}

.proc1{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.phs{border-top:1px solid var(--line)}

.imthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.imth{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;text-align:left}

.mapembed{border:1px solid var(--line);border-radius:var(--r)}
.needsrow{display:flex;gap:6px;flex-wrap:wrap}

.act{position:relative;display:flex;align-items:center;min-width:0}

.maprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:4px 0}

table.matchtbl{min-width:760px}

.srclist li.ritem{flex-direction:column;align-items:stretch;gap:6px;padding:10px 0}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.sub{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:start;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:left;cursor:pointer;min-width:0}
.sub:hover{background:var(--surface-2);border-color:var(--accent)}
.sub.missing{border-style:dashed;cursor:default}
.sub.missing:hover{background:var(--surface);border-color:var(--line)}
.sthumb{width:52px;height:52px;border-radius:4px;overflow:hidden;background:#e9ebe7;display:grid;place-items:center;border:1px solid var(--line)}
.sthumb svg{width:100%;height:100%;display:block}
.sthumb.miss{background:transparent;border:1px dashed var(--line-strong);color:var(--muted);font-weight:700}
.sused{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srcview{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}

.srcbigview svg{width:100%;max-width:440px;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.2)}

.issues{display:flex;flex-direction:column;gap:8px}
.ibox{border-radius:8px;border:1px solid;overflow:hidden}

.ibox.high{border-color:var(--warn);background:var(--warn-weak)}
.ih{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap;padding:8px 12px}
.ibox .ic{font-weight:700;width:14px;text-align:center}
.ibox.block .ic{color:var(--bad)}
.ibox.high .ic{color:var(--warn)}
.iss{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.iss .it{display:flex;flex-direction:column;gap:2px}
.dform{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
details.dismissed summary{cursor:pointer;color:var(--muted)}
.irow2{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px 0}

.phh .st.wait{background:transparent;border-color:var(--line-strong);color:var(--muted)}
.phh .st .spin{width:11px;height:11px}
.phh .ticks{margin-top:4px}
.readlist li.waiting{opacity:.55}
.pending{color:var(--muted)}
.srclist li.pending,.matchlist li.pending{gap:8px}

.othumb.skel{animation:sh 1.3s infinite linear;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%}
.zooms{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.zoom{display:flex;flex-direction:column;gap:2px;padding:0;border:0;background:none;cursor:zoom-in;text-align:left}
.zim{display:block;width:150px;height:90px;max-width:100%;border-radius:5px;overflow:hidden;background:#2f3b38;border:1px solid var(--line)}
.zim svg{width:100%;height:100%;display:block}
.zcap{font-size:11.5px;color:var(--muted)}

.srcgrp{display:grid;grid-template-columns:minmax(220px,360px) minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.srcgrp:first-child{border-top:0;padding-top:0}
.srcbig{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}

.srcbig figcaption{font-size:12.5px;color:var(--muted)}
.outlist{display:flex;flex-direction:column;gap:6px;min-width:0}
.outrow{display:grid;grid-template-columns:22px 64px minmax(0,1fr);gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;text-align:left;width:100%}

.outrow.flag .num1{background:#ff8a3d}
.othumb{width:64px;height:64px;border-radius:5px;overflow:hidden;background:#e8ebe6}
.othumb svg{width:100%;height:100%;display:block}
.outrow .mt{gap:3px}

/* evidence map: which file contributed what to which item */
const ROLE={identity:["ID","Identity"],quantity:["Qty","Quantity"],date:["D/C","Date code"],purchase:["$","Purchase details"],image:["▣","Image"],detail:["·","Other details"],support:["○","Supporting only"]};
function claimsOf(it){
  const p=partOf(it),m={};const add=(e,k)=>{m[e]=m[e]||[];if(k&&!m[e].includes(k))m[e].push(k)};
  it.ev.forEach(e=>add(e));
  [["Description",p.desc],["Manufacturer",p.mfr],["Part number",p.mpn],...p.params.map(x=>[x[0],x[1]]),["Quantity",it.lot.qty],["Date code",it.lot.dc],["Supplier SKU",it.lot.sku],["Unit price",it.lot.price]]
    .forEach(([k,f])=>{if(f&&f.ev&&!f.edited&&it.ev.includes(f.ev))add(f.ev,k)});
  it.outputs.forEach(o=>{if(!o.declined&&it.ev.includes(o.img))add(o.img,o.target)});
  return m;
}
function roleOf(fields){const r=[];
  if(fields.some(f=>/Part number|Description|Manufacturer/.test(f)))r.push("identity");

function issuesOf(it){
  if(it.status==="excluded"||it.status==="added")return [];
  const p=partOf(it),L=[];
  const add=(id,sev,title,detail,level,fix)=>L.push({id,sev,title,detail,level,fix,dismissed:sev==="high"&&it.dismissed&&it.dismissed[id]});
  if(p.mode==="undecided")add("choose","block","Part not chosen",`${p.candidates.length} existing Parts could match. Choose one, or create a new Part.`,"part",{fa:"compare",label:"Compare matches"});
  if(p.mpn.cert==="conflict"&&!p.mpn.edited)add("conflict","block","Sources disagree on the part number",p.mpn.note,"mp",{fa:"viewer",img:p.mpn.ev,label:"Show evidence"});
  if(it.status==="duplicate")add("dup","block","May duplicate existing stock",it.dup.note,"stock",{fa:"scrollq",label:"Decide"});
  if(it.status==="question"&&it.question&&it.question.kind==="qty")add("qtyq","block","Quantity not confirmed",it.question.why,"stock",{fa:"scrollq",label:"Answer"});
  else if(!(Number(it.lot.qty.v)>0))add("qty","block","Quantity missing","A stock item needs a quantity above zero.","stock",{fa:"edit",scope:"lot",key:"qty",label:"Enter quantity"});
  if(p.mode!=="none"&&(/unknown/i.test(p.mfr.v)||(p.mp&&p.mp.none)))add("nomfr","high","Unknown maker","No manufacturer could be read or matched, so no manufacturer part will be created.","mp",{fa:"edit",scope:"part",key:"mfr",label:"Set manufacturer"});
  else if(p.mfr.cert==="likely"&&!p.mfr.edited)add("mfrguess","high","Maker not confirmed",p.mfr.note||"The manufacturer was inferred.","mp",{fa:"viewer",img:p.mfr.ev,label:"Check the logo"});
  if(p.mpn.cert==="likely"&&!p.mpn.edited)add("inferred","high","Part not fully identified",p.mpn.note||"Part of the part number was inferred.","mp",{fa:"edit",scope:"part",key:"mpn",label:"Confirm part number"});
  const exAtt=p.mode==="reuse"&&p.existing?p.existing.attachments:[];
  if(p.mode!=="none"&&!p.docs.length&&!exAtt.length)add("nodatasheet","high","No datasheet found","Nothing was found on the manufacturer or supplier sites, and the Part has no datasheet in InvenTree.","part",{fa:"toast",t:"Attach a file or paste a link here",label:"Add datasheet"});

  return L;
}

/* step pages: status, results and manual corrections for one step */

function matchStep(b,m){

/* prepared images, grouped by the photo they were cut from; limit marks how many are done during a run */
function imagesBySource(b,outs,flagged,limit=Infinity){
  ensureGroups(b);
  const order=[...b.groups.flatMap(g=>g.ev),...b.evidence.filter(e=>!b.groups.some(g=>g.ev.includes(e)))];
  const isFlag=x=>flagged.some(f=>f.o===x.o);
  const srcs=order.filter(e=>outs.some(x=>x.o.img===e)),none=order.filter(e=>!outs.some(x=>x.o.img===e));
  const why=e=>{if(PH[e].doc)return "document";const its=b.items.filter(i=>i.ev.includes(e));return its.length&&its.every(i=>i.status==="excluded")?"only supports an excluded item":"used as evidence only"};
  let gi=0;const groups=srcs.map(e=>({e,list:outs.filter(x=>x.o.img===e).map(x=>Object.assign({ix:gi++},x))}));
  const started=groups.filter(g=>g.list[0].ix<=limit),waiting=groups.length-started.length;
  return started.map(({e,list})=>{
    const ph=PH[e],sw=Math.max(2,ph.w/130),lw=Math.max(14,ph.w/22),g=b.groups.find(x=>x.ev.includes(e));
    const boxes=list.filter(x=>x.ix<limit).map(x=>{const c=x.o.crop,col=isFlag(x)?"#ff8a3d":"#ffd34d",num=list.indexOf(x)+1;
      return `<g><rect x="${c[0]}" y="${c[1]}" width="${c[2]}" height="${c[3]}" fill="none" stroke="${col}" stroke-width="${sw}" ${x.o.declined?`stroke-dasharray="${sw*3} ${sw*2}"`:""}/><rect x="${c[0]}" y="${c[1]}" width="${lw}" height="${lw}" fill="${col}"/><text x="${c[0]+lw/2}" y="${c[1]+lw*.75}" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="${lw*.7}" fill="#111">${num}</text></g>`}).join("");
    return `<div class="srcgrp"><figure class="srcbig"><button class="srcimg" data-a="viewer" data-img="${e}" aria-label="Open ${esc(ph.name)} in the viewer"><svg viewBox="0 0 ${ph.w} ${ph.h}" role="img" aria-label="${esc(ph.name)} with crop outlines">${PHB[e]}${boxes}</svg></button><figcaption><b>${esc(ph.name)}</b> · ${list.length} image${list.length===1?"":"s"} from this photo${g?` · ${esc(g.name)}`:""}</figcaption></figure>
      <div class="outlist">${list.map((x,n)=>{
        if(x.ix>=limit)return `<div class="outrow pending"><span class="num1" aria-hidden="true">${n+1}</span><span class="othumb ${x.ix===limit?"skel":""}"></span><span class="mt"><span><b>${esc(x.o.target)}</b> → ${esc(x.it.title)}</span><span class="small muted">${x.ix===limit?`<span class="spin" aria-hidden="true"></span> Cropping and adjusting…`:"Waiting"}</span></span></div>`;
        const st=outStatus(x.it,x.o);return `<button class="outrow ${isFlag(x)?"flag":""}" data-a="gotoimg" data-o="${x.o.id}" aria-label="${n+1}: ${esc(x.o.target)} for ${esc(x.it.title)}. Open in Images"><span class="num1" aria-hidden="true">${n+1}</span><span class="othumb">${cropSvg(x.o)}</span><span class="mt"><span><b>${esc(x.o.target)}</b> → ${esc(x.it.title)}</span><span class="small muted">${esc(x.o.ops.join(" · "))}</span><span><span class="pill ${st[1]}"><i aria-hidden="true">${st[2]}</i>${st[0]}</span></span></span></button>`}).join("")}</div></div>`}).join("")
    +(waiting?`<p class="small muted" style="margin:0">${waiting} more photo${waiting===1?"":"s"} waiting.</p>`:"")
    +(limit===Infinity&&none.length?`<p class="small muted" style="margin:0">No images from ${none.map(e=>`${esc(PH[e].name)} (${why(e)})`).join(", ")}.</p>`:"");
}

/* background work, shown in the header on every screen */
function jobs(){

}
function segs(phases,big){return `<span class="segs ${big?"big":""}" aria-hidden="true">${phases.map(p=>`<span class="seg ${p.state}" title="${esc(p.t)}: ${p.n} of ${p.tot}"><i style="width:${p.tot?Math.round(p.n/p.tot*100):0}%"></i></span>`).join("")}</span>`}

/* processing (live, simulated) */
function procModel(b){
  const t=b.t||0, N=b.pitems?b.pitems.length:3;
  const read=Math.min(4,Math.floor(t/2)), found=Math.min(N,Math.max(0,Math.floor((t-2)/2))), research=Math.min(N,Math.max(0,Math.floor((t-6)/3))), imgs=Math.min(N,Math.max(0,Math.floor((t-10)/2))), match=Math.min(N,Math.max(0,Math.floor((t-14)/2.4)));
  const ph=[{t:"Reading labels",c:`${read} of 4 files`,n:read,tot:4},{t:"Identifying components",c:`${found} items found so far`,n:found,tot:N,open:true},{t:"Finding supporting information",c:`${research} of ${found||"?"} items`,n:research,tot:N},{t:"Preparing images",c:`${imgs} crops`,n:imgs,tot:N},{t:"Checking existing inventory",c:`${match} of ${found||"?"} items`,n:match,tot:N}];
  ph.forEach(p=>p.state=p.n>=p.tot?"done":p.n>0?"run":"wait");
  const active=ph.find(p=>p.state==="run")||ph.find(p=>p.state==="wait");
  let ready=0,q=0;(b.pitems||[]).forEach((x,i)=>{if(i<match){x[2]==="ready"?ready++:q++}});
  return {ph,active,found,ready,q,match};
}
function processLive(b){
  const p=procModel(b);
  return `<div class="proc"><div class="stack">
    <div class="card">${p.ph.map(x=>`<div class="phase ${x.state}"><span class="st" aria-hidden="true">${x.state==="done"?"✓":x.state==="run"?"⟳":"·"}</span><div><b>${x.t}</b><div class="out">${x.c}</div><div class="ticks" aria-hidden="true">${Array.from({length:x.tot},(_,i)=>`<span class="${i<x.n?(x.state==="done"?"okk":"on"):""}"></span>`).join("")}</div></div><span class="pill ${x.state==="done"?"ok":x.state==="run"?"info":"outline"}">${x.state==="done"?"Done":x.state==="run"?"Working":"Waiting"}</span></div>`).join("")}</div>
    <p class="muted small">No overall percentage: the number of items isn’t known until labels are read. Items appear on the right as soon as they’re found.</p>
    <div class="card" style="padding:14px 16px"><label class="field-label" for="live-instr">Add an instruction</label><div class="instr"><input id="live-instr" type="text" placeholder="e.g. The buzzer is a spare, don’t add it"><button class="btn" data-a="toast" data-t="Instruction added. It applies to items still being processed.">Add</button></div></div>
  </div>
  <div class="stack"><div class="row"><h2>Items found</h2><span class="muted small num">${p.ready} ready · ${p.q} need answers</span></div>
    <div class="card">${b.pitems.slice(0,p.found).map((x,i)=>{const done=i<p.match;return `<div class="phase ${done?"done":"run"}"><span class="st" aria-hidden="true">${done?(x[2]==="ready"?"✓":"?"):"⟳"}</span><div><b>${esc(x[0])}</b><div class="out">${done?esc(x[1]):"Researching…"}</div></div>${done?pill(x[2]):`<span class="pill info"><i>⟳</i>Working</span>`}</div>`}).join("")||`<div class="phase run"><span class="st">⟳</span><div><b>Reading labels…</b><div class="out">Items will appear here.</div></div></div>`}</div>
    ${p.match>=b.pitems.length?`<div class="banner info"><span class="ic">i</span><div>Done. In this prototype, detailed review is shown on <button class="linkbtn" data-a="open" data-id="b1" data-tab="review">${esc(M().name)}</button>.</div></div>`:""}
  </div></div>`;
}

/* question card */
function questionCard(it,compact){
  const p=partOf(it);
  if(it.status==="duplicate"){const d=it.dup;return `<div class="qcard" role="group" aria-label="Possible duplicate"><div class="qh"><span class="ic">≈</span><div><b>${esc(it.title)}: is this stock already in InvenTree?</b><div class="small">${esc(d.note)}</div></div></div><div class="qb">
    <div class="closeups"><div class="c">${pic("p7",[210,30,110,260])}<span class="lab">This photo</span></div><div class="c" style="display:flex;flex-direction:column;justify-content:center;padding:10px;background:var(--surface-2);aspect-ratio:auto"><span class="label">Existing stock</span><b class="mono">${d.ipn} · ${d.lot}</b><span class="small num">${d.qty} pcs · D/C ${d.dc}</span><span class="small">${esc(d.loc)}</span><span class="small muted">Added ${d.added}</span><a class="small" href="https://inventree.example/stock/item/1712/" target="_blank" rel="noopener">Open in InvenTree ↗</a></div></div>
    <div class="row"><button class="btn" data-a="dupsame" data-id="${it.id}">Same stock — don’t add</button><button class="btn" data-a="dupnew" data-id="${it.id}">Different stock — add a new lot</button>${compact?`<button class="btn ghost" data-a="gotoitem" data-id="${it.id}">Open item</button>`:""}<button class="btn ghost" data-a="defer" data-id="${it.id}">Decide later</button></div></div></div>`}
  const q=it.question;
  let body="";

/* review list */
const FILTERS=[["all","All"],["ready","Ready"],["attn","Needs answers"],["block","Blocking"],["warn","Warnings"],["changed","Changed after review"],["excluded","Excluded"]];
function inFilter(i,f){if(f==="all")return true;if(f==="block")return openIssues(i).some(x=>x.sev==="block");if(f==="warn")return openIssues(i).some(x=>x.sev==="high");if(f==="ready")return i.status==="ready";if(f==="attn")return ["question","duplicate","deferred"].includes(i.status);if(f==="changed")return !!i.changedAfterReview;if(f==="excluded")return i.status==="excluded";return true}
function visItems(b){return b.items.filter(i=>inFilter(i,UI.filter))}
function reviewTop(b){
  const c=counts(b);
  const n={all:b.items.length,ready:c.ready,attn:c.question+c.duplicate+c.deferred,block:b.items.filter(i=>inFilter(i,"block")).length,warn:b.items.filter(i=>inFilter(i,"warn")).length,changed:c.changed,excluded:c.excluded};
  return `<div class="rv-top"><div class="seg" role="group" aria-label="Layout"><button aria-pressed="${UI.mode==="split"}" data-a="mode" data-v="split">Workspace</button><button aria-pressed="${UI.mode==="table"}" data-a="mode" data-v="table">Table</button></div>
  <div class="filters" role="group" aria-label="Filter">${FILTERS.filter(f=>!["changed","block","warn"].includes(f[0])||n[f[0]]).map(f=>`<button class="fbtn" aria-pressed="${UI.filter===f[0]}" data-a="filter" data-v="${f[0]}">${f[1]} <span class="num">${n[f[0]]}</span></button>`).join("")}</div>
  <span class="sp"></span><span class="hint muted small"><span class="kbd">J</span>/<span class="kbd">K</span> move · <span class="kbd">R</span> mark reviewed · <span class="kbd">V</span> view evidence · <span class="kbd">E</span> edit quantity</span>
  <button class="btn sm" data-a="tab" data-v="capture">＋ Add evidence</button></div>`;
}
function itemRow(i){
  const p=partOf(i);const o=i.outputs[0];
  const sub=`<span class="mono">${esc(p.mpn.v)}</span><span>· ${esc(String(i.lot.qty.v))}${i.lot.qty.cert==="guess"?"?":""} pcs</span>`;
  return `<button class="irow" data-a="sel" data-id="${i.id}" aria-current="${UI.item===i.id}"><span class="thumb">${o?pic(o.img,o.crop):pic(i.ev[0])}</span><span style="min-width:0"><span class="t" style="display:block">${esc(i.title)}</span><span class="s">${pill(i.status)}${i.status==="ready"&&i.reviewed?`<span class="pill outline" title="Reviewed"><i>✓</i>Reviewed</span>`:""}${i.changedAfterReview?`<span class="pill warn"><i>!</i>Changed</span>`:""}${issuePills(i)}</span><span class="s">${sub}</span></span></button>`;
}
function reviewSplit(b){
  const its=visItems(b);
  if(!its.find(i=>i.id===UI.item)&&its.length)UI.item=its[0].id;
  const it=itemById(UI.item);
  const groups=[["Needs your answer",its.filter(i=>["question","duplicate","deferred"].includes(i.status))],["Ready",its.filter(i=>i.status==="ready")],["Excluded",its.filter(i=>i.status==="excluded")],["Added",its.filter(i=>i.status==="added")]];
  return reviewTop(b)+`<div class="split ${UI.mobileDetail?"showdetail":""}">
   <div class="col card listcol" role="navigation" aria-label="Items"><div class="ilist">${groups.filter(g=>g[1].length).map(g=>`<div class="igroup">${g[0]} · ${g[1].length}</div>${g[1].map(itemRow).join("")}`).join("")||`<p class="muted" style="padding:12px">No items match this filter.</p>`}</div></div>
   <div class="col card evcol">${it?evidencePane(it):""}</div>
   <div class="col card detcol">${it?detail(it):""}</div>
  </div>`;
}
function evidencePane(it,inline){
  const b=M();const sel=UI.evSel[it.id]||it.ev[0];const reg=(b.regions[sel]||{});
  const others=Object.keys(reg).filter(k=>k!==it.id);

/* detail editor */
function srcChip(f){const c=CERT[f.cert]||{t:f.cert,k:""};const src=f.edited?"You":SRC[f.src];return `<span class="src ${f.edited?"user":c.k}" role="button" tabindex="0" data-a="src" data-img="${f.ev||""}" title="${esc((f.note||c.t)+(f.ev?" — click to show in photo":""))}">${esc(src)} · ${esc(f.edited?"Your edit":c.t)}</span>`}
function valCell(it,scope,key,f,o={}){

/* record levels: what each item adds to InvenTree */
const EXIST_SKU=["187-CL10B104KB8NNNC"], EXIST_LOC=["Incoming inspection drawer","Blue drawer"];
const RST={exists:{t:"Exists",i:"✓",cls:"ok"},new:{t:"New",i:"＋",cls:"info"},update:{t:"Update",i:"↻",cls:"acc"},none:{t:"Not used",i:"–",cls:"neutral"},choose:{t:"Choose",i:"?",cls:"warn"},off:{t:"Off",i:"○",cls:"outline"}};
const rpill=s=>{const d=RST[s];return `<span class="pill ${d.cls}"><i aria-hidden="true">${d.i}</i>${d.t}</span>`};
const normv=s=>String(s??"").toLowerCase().replace(/[^a-z0-9.µ]/g,"");
function supplierOf(it){return it.lot.supplier?null:M().shared.supplier}
function locOf(it){return (it.lot.loc&&it.lot.loc.v)||M().shared.location}
function partImages(pk){return lotsOfPart(pk).flatMap(l=>l.outputs.filter(o=>o.target==="Part image"&&!o.declined).map(o=>({it:l,o})))}
function partUpdates(pk){
  const p=M().parts[pk];if(p.mode!=="reuse"||!p.existing)return [];
  const ex=p.existing,ow=p.ow||{},u=[];
  if(ow.desc&&normv(ex.desc)!==normv(p.desc.v))u.push("overwrite description");
  p.params.forEach(([k,f])=>{const e=ex.params[k];if(e==null)u.push("+ "+k);else if(ow["param:"+k]&&normv(e)!==normv(f.v))u.push("overwrite "+k)});
  if(partImages(pk).length){if(!ex.image)u.push("+ image");else if(p.imageChoice==="replace")u.push("replace image")}
  p.docs.forEach(d=>{if(!ex.attachments.includes(d.n))u.push("+ "+d.n.replace(/ \(.*\)/,""))});
  return u;
}
function levels(it){
  const b=M(),p=partOf(it),none=p.mode==="none"||it.status==="excluded",sup=supplierOf(it),shared=lotsOfPart(it.part).length>1;
  const L=[];
  L.push({k:"cat",name:"Category",title:p.cat.v,st:none?"none":p.catExists===false?"new":"exists"});
  L.push({k:"part",name:"Part",title:p.mode==="undecided"?"":p.ipn.replace(" (new)",""),st:none?"none":p.mode==="undecided"?"choose":p.mode==="new"?"new":partUpdates(it.part).length?"update":"exists",shared});
  L.push({k:"mp",name:"Manufacturer part",title:p.mpn.v,st:none||(p.mp&&p.mp.none)?"none":p.mode==="undecided"?"choose":p.mp&&p.mp.exists?"exists":"new",shared});
  L.push({k:"sp",name:"Supplier part",title:sup?it.lot.sku.v:"",st:none||!sup?"none":EXIST_SKU.includes(it.lot.sku.v)?"exists":"new",shared:shared&&!!sup});
  if(sup)L.push({k:"po",name:"Purchase order",title:b.shared.po?"Order "+b.order:"",st:none?"none":b.shared.po?"new":"off"});
  L.push({k:"stock",name:"Stock item",title:`${it.lot.qty.v} pcs`,st:it.status==="added"?"exists":none?"none":"new"});
  L.push({k:"loc",name:"Location",title:locOf(it),st:none?"none":EXIST_LOC.includes(locOf(it))?"exists":"new"});
  return L;
}
function openDefault(it,k){return k==="part"||k==="stock"||(k==="mp"&&partOf(it).mode==="undecided")}
function recOpenList(id){if(!UI.recOpen[id]){const it=itemById(id);UI.recOpen[id]=levels(it).map(l=>l.k).filter(k=>openDefault(it,k))}return UI.recOpen[id]}
function chain(it){return `<nav class="chain" aria-label="Records for this item">${levels(it).map((l,ix)=>`${ix?`<span class="arrow" aria-hidden="true">›</span>`:""}<button class="link-chip st-${l.st}" data-a="recjump" data-id="${it.id}" data-k="${l.k}"><span class="lk">${l.name}</span><span class="ls"><i aria-hidden="true">${RST[l.st].i}</i>${RST[l.st].t}${l.shared&&l.st!=="none"?" · shared":""}</span></button>`).join("")}</nav>`}
function recCard(it,l,body){
  const open=recOpenList(it.id).includes(l.k);
  return `<section class="rec st-${l.st}" id="rec-${it.id}-${l.k}" aria-label="${esc(l.name)}"><button class="rech" data-a="rectoggle" data-id="${it.id}" data-k="${l.k}" aria-expanded="${open}"><span class="caret" aria-hidden="true">${open?"▾":"▸"}</span><span class="rname">${l.name}</span>${rpill(l.st)}${(()=>{const is=openIssues(it).filter(x=>x.level===l.k);if(!is.length)return "";const b=is.some(x=>x.sev==="block");return `<span class="pill ${b?"bad":"warn"}" title="${esc(is.map(x=>x.title).join(", "))}"><i aria-hidden="true">${b?"⨯":"!"}</i>${is.length}</span>`})()}<span class="rtitle ${["mp","sp"].includes(l.k)?"mono":""}">${esc(l.title||"")}</span></button>${open?`<div class="recb">${body()}</div>`:""}</section>`;
}
function sharedBlock(it,msg){const lots=lotsOfPart(it.part);if(lots.length<2)return "";return `<div class="shared"><span><b>Shared by ${lots.length} stock items</b> — ${msg}</span>${lots.map(l=>`<span>${l.id===it.id?"<b>This item</b>":`<button class="linkbtn" data-a="gotoitem" data-id="${l.id}">${esc(l.title)}</button>`} · <span class="num">${esc(String(l.lot.qty.v))}</span> pcs · D/C ${esc(l.lot.dc.v)}</span>`).join("")}</div>`}
function cmpRow(it,owKey,label,exVal,f,scope,key){
  const p=partOf(it),ow=(p.ow||{})[owKey];
  if(exVal==null||exVal==="")return `<dt>${esc(label)}</dt><dd>${valCell(it,scope,key,f,{label})}<span class="tag add">＋ Will be added</span></dd>`;
  if(normv(exVal)===normv(f.v))return `<dt>${esc(label)}</dt><dd><div class="val"><span class="v">${esc(exVal)}</span><span class="tag same">= Same in InvenTree</span></div></dd>`;
  return `<dt>${esc(label)}</dt><dd><div class="diffbox ${ow?"ow":""}"><div class="dl"><span class="dk">In InvenTree</span><span class="${ow?"strike":""}">${esc(exVal)}</span></div><div class="dl"><span class="dk">Proposed</span>${valCell(it,scope,key,f,{label})}</div><div class="row"><div class="seg sm" role="group" aria-label="${esc(label)}: which value"><button aria-pressed="${!ow}" data-a="ow" data-part="${it.part}" data-k="${esc(owKey)}" data-v="0">Keep existing</button><button aria-pressed="${!!ow}" data-a="ow" data-part="${it.part}" data-k="${esc(owKey)}" data-v="1">Use proposed</button></div>${ow?`<span class="small" style="color:var(--warn)">! Overwrites the value in InvenTree</span>`:""}</div></div></dd>`;
}
function existingImg(ex){return `<svg viewBox="${ex.crop.join(" ")}" preserveAspectRatio="xMidYMid slice" style="filter:grayscale(.5) brightness(.95)" role="img" aria-label="Current Part image">${PHB[ex.img]}</svg>`}
function autoNotes(it){const n=[],q=it.lot.qty;
  if(q.cert==="guess")n.push("Quantity is an estimate from the note on the bag, not a count.");
  else if(q.src==="hand")n.push("Count from the handwritten note on the packet.");

  else if(q.src==="photo")n.push("Count from the photo.");

function recBody(it,l){
  const b=M(),p=partOf(it),sh=b.shared,sup=supplierOf(it);

  const link=(path,label)=>`<a class="small mono" href="https://inventree.example/${path}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;

    else if(p.mode==="reuse")h+=`<div class="row small">${link("part/"+p.ipn+"/",p.ipn)}<span class="muted">${esc(p.existingName)} · ${esc(p.stockNow)}</span>${p.candidates.length?`<button class="linkbtn" data-a="compare" data-id="${it.id}">Compare matches</button>`:""}</div>`;
    else if(p.mode==="new")h+=`<div class="row small"><span class="mono">${esc(p.ipn.replace(" (new)",""))}</span><span class="muted">will be created</span>${p.candidates.length?`<button class="linkbtn" data-a="compare" data-id="${it.id}">Compare with ${p.candidates.length} existing Part${p.candidates.length>1?"s":""}</button>`:""}</div>`;

    const showAll=UI.showAllParams[it.part],params=showAll?p.params:p.params.slice(0,4);
    let psum=`${p.params.length} new`;if(ex){const add=p.params.filter(([k])=>ex.params[k]==null).length,same=p.params.filter(([k,f])=>ex.params[k]!=null&&normv(ex.params[k])===normv(f.v)).length;psum=`${same} same · ${add} to add${p.params.length-add-same?` · ${p.params.length-add-same} differ`:""}`}

  if(l.k==="sp"){

const FB=["Too tight","Too loose","Include the leads","Too dark","Too bright","Keep colours natural","Straighten it","Wrong item"];
function cropSvg(o,raw){const c=o.crop,cx=c[0]+c[2]/2,cy=c[1]+c[3]/2;const f=raw?"":`filter:brightness(${o.light||1}) contrast(${o.contrast||1});`;
  return `<svg viewBox="${c.join(" ")}" preserveAspectRatio="xMidYMid meet" style="transform:rotate(${o.rot||0}deg);${f}" role="img" aria-label="${raw?"Before":"After"}: ${esc(PH[o.img].name)}"><g ${!raw&&o.straighten?`transform="rotate(${o.straighten} ${cx} ${cy})"`:""}>${PHB[o.img]}</g></svg>`}
function findOut(oid){for(const it of M().items){const o=it.outputs.find(x=>x.id===oid);if(o)return {it,o}}return {}}
function imgChanged(it){if(it.reviewed){it.reviewed=false;it.changedAfterReview="image changed after review"}}
function outStatus(it,o){
  if(o.declined)return ["Won’t attach","neutral","–"];
  if(UI.reproc[o.id])return ["Reprocessing","info","⟳"];
  if(o.prev)return ["Choose a version","warn","?"];
  if((it.cropIssue&&o===it.outputs.find(x=>x.target==="Part image"))||o.attention)return ["Needs attention","warn","!"];
  const p=partOf(it);if(o.target==="Part image"&&p.mode==="reuse"&&p.existing&&p.existing.image&&p.imageChoice!=="replace")return ["Not used — current kept","neutral","–"];
  if(o.adjusted||o.ver>1)return ["Changed","acc","✎"];
  return ["Proposed","outline","·"]}
function imgCard(it,o,opt){
  const p=partOf(it),st=outStatus(it,o),fb=UI.fb===o.id,ph=PH[o.img],c=o.crop;
  const exImg=o.target==="Part image"&&p.mode==="reuse"&&p.existing&&p.existing.image;
  const dim=o.declined||(exImg&&p.imageChoice!=="replace");
  const dest=o.target==="Part image"?`Part image · ${p.mode==="undecided"?"Part to be chosen":p.ipn.replace(" (new)","")}`:`Attachment · stock item`;
  const issue=it.cropIssue&&o===it.outputs.find(x=>x.target==="Part image");
  return `<article class="imcard ${dim?"dim":""}" id="img-${o.id}" aria-label="${esc(o.target)} for ${esc(it.title)}">

    ${exImg?`<div class="excmp"><span class="exim">${existingImg(p.existing.image)}</span><span class="small" style="flex:1;min-width:120px">InvenTree already has a Part image.</span><div class="seg sm" role="group" aria-label="Part image"><button aria-pressed="${p.imageChoice!=="replace"}" data-a="imgchoice" data-part="${it.part}" data-v="keep">Keep current</button><button aria-pressed="${p.imageChoice==="replace"}" data-a="imgchoice" data-part="${it.part}" data-v="replace">Replace</button></div></div>`:""}
    <div class="imgrid">
      <figure><div class="srcim"><svg viewBox="0 0 ${ph.w} ${ph.h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Original: ${esc(ph.name)}">${PHB[o.img]}<rect x="${c[0]}" y="${c[1]}" width="${c[2]}" height="${c[3]}" fill="none" stroke="#ffd34d" stroke-width="${Math.max(2,ph.w/130)}"/></svg></div><figcaption>Original · ${esc(ph.name)}</figcaption></figure>
      <figure><div class="wipe" style="--w:50%">${UI.reproc[o.id]?`<div class="wl" style="display:grid;place-items:center;color:#fff"><span class="spin" aria-label="Reprocessing"></span></div>`:`<div class="wl">${cropSvg(o,true)}</div><div class="wl after">${cropSvg(o)}</div><div class="wbar"></div><input type="range" min="0" max="100" value="50" data-c="wipe" aria-label="Slide to compare before and after processing"><span class="wt l">Before</span><span class="wt r">After</span>`}</div><figcaption>${esc(dest)}</figcaption></figure>
    </div>
    <div class="chips">${o.ops.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>
    ${o.fbNote?`<p class="small muted" style="margin:0">Your feedback: “${esc(o.fbNote)}”</p>`:""}

    ${o.prev?`<div class="vers"><div class="vgrid"><figure><div class="vim">${cropSvg(o.prev)}</div><figcaption>v${o.ver-1} · before your feedback</figcaption></figure><figure><div class="vim">${cropSvg(o)}</div><figcaption>v${o.ver} · new</figcaption></figure></div><div class="row"><button class="btn sm primary" data-a="vkeep" data-o="${o.id}">Keep v${o.ver}</button><button class="btn sm" data-a="vback" data-o="${o.id}">Go back to v${o.ver-1}</button></div></div>`:""}
    ${fb?`<form class="fbform" data-f="feedback" data-o="${o.id}"><span class="small" style="font-weight:600">What should change in this image?</span><div class="chips">${FB.map(x=>`<button type="button" class="fchip" aria-pressed="${(UI.fbChips[o.id]||[]).includes(x)}" data-a="fbchip" data-o="${o.id}" data-v="${x}">${x}</button>`).join("")}</div><label class="sr" for="fbt-${o.id}">Describe the change</label><textarea id="fbt-${o.id}" data-c="fbtext" data-o="${o.id}" placeholder="e.g. Show the whole label, and keep the pink of the bag">${esc(UI.fbText[o.id]||"")}</textarea><div class="row"><button class="btn sm primary">Reprocess this image</button><button type="button" class="btn sm ghost" data-a="fbclose">Cancel</button><span class="muted small">The original photo is never changed.</span></div></form>`:""}
    <div class="row">${o.declined?`<button class="btn sm" data-a="imgattach" data-o="${o.id}">Attach after all</button>`:`<button class="btn sm" data-a="viewer" data-img="${o.img}" data-item="${it.id}" data-out="${o.id}">Adjust crop</button><button class="btn sm ${fb?"primary":""}" data-a="fbopen" data-o="${o.id}" aria-expanded="${fb}">Ask for a change</button><button class="btn sm ghost" data-a="imgdecline" data-o="${o.id}">Don’t attach</button>`}</div>
  </article>`;
}
function reprocess(it,o,chips,t){
  UI.fb=null;UI.reproc[o.id]=true;render();
  setTimeout(()=>{delete UI.reproc[o.id];
    o.prev={img:o.img,crop:o.crop.slice(),rot:o.rot,light:o.light,contrast:o.contrast,straighten:o.straighten,ops:o.ops.slice()};
    const ph=PH[o.img];let [x,y,w,h]=o.crop;
    const ops=o.ops.filter(op=>!/^(Wider|Tighter|Extended|Brighter|Darker|Natural|Straightened$|Adjusted)/.test(op));
    const grow=f=>{const dx=w*f/2,dy=h*f/2;x-=dx;y-=dy;w+=2*dx;h+=2*dy};
    const issue=it.cropIssue&&o===it.outputs.find(q=>q.target==="Part image");
    if(chips.includes("Too tight")){grow(.25);ops.push("Wider crop")}
    if(chips.includes("Too loose")){grow(-.15);ops.push("Tighter crop")}
    if(chips.includes("Include the leads")){x-=w*.12;w*=1.24;h*=1.55;ops.push("Extended to include leads")}
    if(chips.includes("Too dark")){o.light=(o.light||1)+.18;ops.push("Brighter")}
    if(chips.includes("Too bright")){o.light=(o.light||1)-.15;ops.push("Darker")}
    if(chips.includes("Keep colours natural")){o.light=1;o.contrast=1;for(let i=ops.length-1;i>=0;i--)if(/Lighting|Contrast/.test(ops[i]))ops.splice(i,1);ops.push("Natural colours")}
    if(chips.includes("Straighten it")){o.straighten=o.straighten?0:-4;ops.push("Straightened")}
    if(chips.includes("Wrong item"))o.attention="Marked as the wrong item. Use Adjust crop to frame the right part of the photo, or pick another photo in the viewer.";
    if(!chips.length&&t){grow(.08);ops.push("Adjusted to your note")}
    x=Math.max(0,x);y=Math.max(0,y);w=Math.min(ph.w-x,w);h=Math.min(ph.h-y,h);
    o.crop=[x,y,w,h].map(Math.round);o.ops=ops;o.ver=(o.ver||1)+1;o.fbNote=[...chips,t].filter(Boolean).join(" · ");
    if(issue&&(chips.includes("Include the leads")||chips.includes("Too tight"))){it.cropIssue=false;o.fixedIssue=true}
    UI.fbChips[o.id]=[];UI.fbText[o.id]="";touch();toast("Reprocessed. Compare the two versions and keep one.");render()},1400);
}

/* approve */
function approve(b){
  const ready=b.items.filter(i=>i.status==="ready");

  const open=b.items.filter(i=>["question","duplicate","deferred"].includes(i.status));
  const excl=b.items.filter(i=>i.status==="excluded");
  const off=UI.scenario==="offline";
  const R={parts:{new:[],update:[],exists:[]},mp:{new:[],exists:[]},sp:{new:[],exists:[]},cos:[],cats:[],locs:[],ow:[]};
  const img={add:0,replace:0,kept:0,stock:0,docs:0};const seenP=new Set(),seenS=new Set();

    img.stock+=i.outputs.filter(o=>o.target!=="Part image"&&!o.declined).length;
    if(!seenP.has(i.part)){seenP.add(i.part);
      const s=st("part");if(R.parts[s])R.parts[s].push(i.part);
      const m=st("mp");if(R.mp[m])R.mp[m].push(i.part);
      if(p.mfrExists===false&&m==="new"&&!R.cos.includes(p.mfr.v))R.cos.push(p.mfr.v);
      if(p.catExists===false&&!R.cats.includes(p.cat.v))R.cats.push(p.cat.v);
      Object.entries(p.ow||{}).forEach(([k,v])=>{if(v)R.ow.push(`${p.ipn}: ${k==="desc"?"description":k.replace("param:","")}`)});
      const exImg=p.mode==="reuse"&&p.existing&&p.existing.image;
      if(partImages(i.part).length){if(!exImg)img.add++;else if(p.imageChoice==="replace"){img.replace++;R.ow.push(`${p.ipn}: Part image replaced`)}else img.kept++}
      img.docs+=p.docs.filter(d=>!(p.mode==="reuse"&&p.existing&&p.existing.attachments.includes(d.n))).length}
    const sp=st("sp");if(R.sp[sp]&&!seenS.has(i.lot.sku.v)){seenS.add(i.lot.sku.v);R.sp[sp].push(i)}
    const loc=locOf(i);if(!EXIST_LOC.includes(loc)&&!R.locs.includes(loc))R.locs.push(loc)});
  const poLines=sel.filter(i=>supplierOf(i));const po=b.shared.po&&poLines.length;
  const P=k=>M().parts[k];
  const lotsTxt=k=>{const l=sel.filter(x=>x.part===k);return l.length>1?`<span class="shared">One Part, ${l.length} stock items: ${l.map(x=>`${esc(String(x.lot.qty.v))} pcs D/C ${esc(x.lot.dc.v)}`).join(" and ")}</span>`:""};
