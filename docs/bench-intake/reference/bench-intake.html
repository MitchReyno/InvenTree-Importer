  const nNew=sel.length+R.parts.new.length+R.mp.new.length+R.sp.new.length+R.cos.length+R.cats.length+R.locs.length+(po?1:0);
  const nUpd=R.parts.update.length;
  const row=(i,checked,dis,extra)=>`<div class="arow ${dis?"dim":""}"><input type="checkbox" ${checked?"checked":""} ${dis?"disabled":""} data-c="apsel" data-id="${i.id}" aria-label="Include ${esc(i.title)}"><span class="thumb">${i.outputs[0]?pic(i.outputs[0].img,i.outputs[0].crop):pic(i.ev[0])}</span><span style="min-width:0"><b>${esc(i.title)}</b><br><span class="small muted num">${esc(String(i.lot.qty.v))} pcs · ${esc(locOf(i))}</span></span><span>${extra}</span></div>`;
  return `<div class="appr"><div class="stack">
    <div class="card alist"><div class="sec"><h2>Choose what to add</h2><p class="muted small" style="margin:4px 0 0">Approval covers the proposal as it is now. Editing an item afterwards sends it back for review.</p></div>
      <div class="sec" style="padding-bottom:4px"><span class="label">Reviewed and ready · ${ready.filter(i=>i.reviewed).length}</span></div>
      ${ready.filter(i=>i.reviewed).map(i=>row(i,UI.approveSel.includes(i.id),false,i.cropIssue?`<span class="pill warn"><i>▢</i>Crop</span>`:"")).join("")}
      ${changed.length?`<div class="sec" style="padding-bottom:4px"><span class="label">Needs review${changed.some(i=>i.changedAfterReview)?" again":""} · ${changed.length}</span></div>${changed.map(i=>row(i,false,true,`<span class="row" style="gap:4px;justify-content:flex-end">${issuePills(i)}<button class="btn sm" data-a="gotoitem" data-id="${i.id}">Review</button></span>`)).join("")}`:""}
      ${open.length?`<div class="sec" style="padding-bottom:4px"><span class="label">Waiting for answers — stay in the workspace · ${open.length}</span></div>${open.map(i=>row(i,false,true,`<button class="btn sm" data-a="gotoitem" data-id="${i.id}">Answer</button>`)).join("")}`:""}
      ${excl.length?`<div class="sec" style="padding-bottom:4px"><span class="label">Excluded · ${excl.length}</span></div>${excl.map(i=>row(i,false,true,`<span class="small muted">${esc(i.excludedWhy||"")}</span>`)).join("")}`:""}
    </div></div>
    <div class="stack"><div class="card">
      <div class="sumsec"><h2>What will change in InvenTree</h2><p class="muted small" style="margin:4px 0 0">${nNew} records created · ${nUpd} existing record${nUpd===1?"":"s"} updated · ${R.ow.length?`<b style="color:var(--warn)">${R.ow.length} value${R.ow.length===1?"":"s"} overwritten</b>`:"nothing overwritten"}</p></div>
      ${sec("Stock items to add",sel.length,ul(sel.map(i=>`<li><span class="num mono">${esc(String(i.lot.qty.v))}</span> × ${esc(i.title)} <span class="muted small">D/C ${esc(i.lot.dc.v)} · ${esc(locOf(i))}</span></li>`)))}
      ${sec("Parts",seenP.size,ul([
        ...R.parts.new.map(k=>`<li style="flex-direction:column;align-items:flex-start;gap:2px"><span>${rpill("new")} <span class="mono">${esc(P(k).ipn.replace(" (new)",""))}</span> ${esc(P(k).desc.v)}</span>${lotsTxt(k)}</li>`),
        ...R.parts.update.map(k=>`<li>${rpill("update")} <span class="mono">${esc(P(k).ipn)}</span> <span class="small">${esc(partUpdates(k).join(", "))}</span></li>`),
        ...R.parts.exists.map(k=>`<li>${rpill("exists")} <span class="mono">${esc(P(k).ipn)}</span> ${esc(P(k).existingName)} <span class="muted small">unchanged</span></li>`)]))}
      ${sec("Manufacturer parts",R.mp.new.length+R.mp.exists.length,ul([...R.mp.new.map(k=>`<li>${rpill("new")} <span class="mono">${esc(P(k).mpn.v)}</span> ${esc(P(k).mfr.v)}</li>`),...R.mp.exists.map(k=>`<li>${rpill("exists")} <span class="mono">${esc(P(k).mpn.v)}</span> ${esc(P(k).mfr.v)}</li>`)]))}
      ${sec("Supplier parts",R.sp.new.length+R.sp.exists.length,ul([...R.sp.new.map(i=>`<li>${rpill("new")} <span class="mono">${esc(i.lot.sku.v)}</span> ${esc(supplierOf(i))}</li>`),...R.sp.exists.map(i=>`<li>${rpill("exists")} <span class="mono">${esc(i.lot.sku.v)}</span> ${esc(supplierOf(i))}</li>`)]))}
      ${sec("Purchase order",po?1:0,b.shared.po?`<ul><li>${rpill("new")} ${esc(b.shared.supplier)} · ref <span class="mono">${esc(b.order)}</span> · ${poLines.length} lines, received in full</li></ul><div style="margin-top:6px"><button class="btn sm" data-a="potoggle">Don’t create a purchase order</button></div>`:`<p class="small muted" style="margin:6px 0">Not creating one. Supplier parts and purchase prices on the stock items record the purchase.</p><button class="btn sm" data-a="potoggle">Create a purchase order</button>`)}
      ${sec("Other new records",R.cos.length+R.cats.length+R.locs.length,ul([...R.cos.map(c=>`<li>${rpill("new")} Manufacturer: ${esc(c)}</li>`),...R.cats.map(c=>`<li>${rpill("new")} Category: ${esc(c)}</li>`),...R.locs.map(c=>`<li>${rpill("new")} Location: ${esc(c)}</li>`)]))}
      ${sec("Images and attachments",img.add+img.replace+img.stock+img.docs,ul([`<li>${img.add} new Part image${img.add===1?"":"s"}${img.replace?` · ${img.replace} replacing the current image`:""}${img.kept?` · ${img.kept} current image kept`:""}</li>`,`<li>${img.stock} photo${img.stock===1?"":"s"} attached to stock items, plus the original photos</li>`,`<li>${img.docs} datasheet${img.docs===1?"":"s"} attached to Parts</li>`]))}
      ${sec("Changes to existing records",nUpd,ul(R.parts.update.map(k=>`<li>${rpill("update")} <span class="mono">${esc(P(k).ipn)}</span> <span class="small">${esc(partUpdates(k).join(", "))}</span></li>`))+(R.ow.length?`<div class="banner warn" style="margin-top:8px"><span class="ic">!</span><div class="small"><b>${R.ow.length} existing value${R.ow.length>1?"s":""} will be overwritten:</b> ${esc(R.ow.join("; "))}</div></div>`:`<p class="small muted" style="margin:6px 0 0">Nothing existing is overwritten. Only missing values and attachments are added.</p>`))}
      ${(()=>{const d=sel.flatMap(i=>issuesOf(i).filter(x=>x.dismissed).map(x=>({i,x})));return d.length?sec("Dismissed warnings",d.length,ul(d.map(({i,x})=>`<li><span>${esc(i.title)}: ${esc(x.title)}</span><span class="muted small">${esc(x.dismissed.reason||"No reason given")}</span></li>`))+`<p class="small muted" style="margin:6px 0 0">Kept in each stock item’s notes so the decision stays visible in InvenTree.</p>`):""})()}
      ${sec("Not included",b.items.length-sel.length,`<ul><li>${open.length} waiting for answers · ${changed.length} need review · ${excl.length} excluded · ${ready.filter(i=>i.reviewed).length-sel.length} unticked</li></ul>`)}
    </div>
    <div class="approve-foot">${off?`<span class="small" style="color:var(--bad)">InvenTree is unreachable. Approval will be possible when it’s back.</span>`:`<span class="small muted">Creates ${nNew} records${nUpd?`, updates ${nUpd}`:""}.</span>`}<span class="sp"></span><button class="btn primary lg" data-a="approve" ${sel.length&&!off?"":"disabled"}>Approve ${sel.length} item${sel.length===1?"":"s"} and add to InvenTree</button></div>
  </div></div>`;
}

/* results */
function impHeadline(b){const im=b.imp;const added=im.rows.filter(r=>r.st==="added").length;const unc=im.rows.filter(r=>r.st==="uncertain").length;const failAtt=im.rows.reduce((n,r)=>n+r.att.filter(a=>a.st==="failed").length,0);
  if(im.running)return `Adding ${im.rows.length} stock lots… ${added} done.`;
  let s=added===im.rows.length?`All ${added} stock lots were added.`:`${added} of ${im.rows.length} stock lots were added.`;
  if(unc)s+=` ${unc} needs checking before anything else happens.`;
  if(failAtt)s+=` ${failAtt===1?"One datasheet attachment":failAtt+" attachments"} still need${failAtt===1?"s":""} attention.`;
  if(!unc&&!failAtt)s+=" Everything is attached.";
  return s}
function results(b){
  const im=b.imp;if(!im)return `<p class="muted">Nothing has been approved yet.</p>`;
  const unc=im.rows.some(r=>r.st==="uncertain");const fail=im.rows.some(r=>r.att.some(a=>a.st==="failed"));
  const left=counts(b);const open=left.question+left.duplicate+left.deferred+left.ready;
  const big=im.running?["⟳","info"]:unc?["?","warn"]:fail?["!","warn"]:["✓","ok"];
  return `<div class="results">
  <div class="card outcome" role="status"><div class="big" style="background:var(--${big[1]}-weak);color:var(--${big[1]})">${big[0]}</div><div class="stack" style="gap:6px"><h2>${impHeadline(b)}</h2>${im.po&&!im.running?`<p class="small" style="margin:0">Purchase order <a href="https://inventree.example/order/purchase-order/231/" target="_blank" rel="noopener" class="mono">${im.po} ↗</a> was created with ${im.rows.filter(r=>supplierOf(itemById(r.id))).length} lines and marked received.</p>`:""}
    ${!im.running&&open?`<p class="muted small" style="margin:0">${open} item${open===1?"":"s"} remain in this batch’s workspace. <button class="linkbtn" data-a="tab" data-v="review">Continue reviewing</button></p>`:""}</div></div>
  <div class="card">${im.rows.map(r=>{const i=itemById(r.id);const p=partOf(i);
    const ic=r.st==="added"?`<span class="okc" aria-label="Added">✓</span>`:r.st==="uncertain"?`<span class="warnc" aria-label="Checking">?</span>`:r.st==="adding"?`<span class="spin" aria-label="Adding"></span>`:`<span class="muted" aria-label="Queued">·</span>`;
    let right="";if(r.st==="added")right=`<a class="btn sm" href="https://inventree.example/stock/item/${r.stockId}/" target="_blank" rel="noopener">Stock #${r.stockId} ↗</a>`;
    let sub="";
    if(r.st==="added"){sub+=`<span>${p.mode==="reuse"?"Added to existing Part":"Created Part"} <a href="https://inventree.example/part/${esc(r.partId)}/" target="_blank" rel="noopener" class="mono">${esc(r.partId)}</a>${r.sharedNote?" · "+esc(r.sharedNote):""}</span>`;
      sub+=r.att.map(a=>`<span class="att">${a.st==="ok"?`<span class="okc">✓</span>`:a.st==="retrying"?`<span class="spin"></span>`:`<span class="badc">✕</span>`} ${esc(a.n)}${a.st==="failed"?` — <span style="color:var(--bad)">${esc(a.why)}</span> <button class="btn sm" data-a="retryatt" data-id="${r.id}" data-n="${esc(a.n)}">Retry attachment</button>`:""}${a.st==="retrying"?" — retrying…":""}</span>`).join("")}
    if(r.st==="uncertain")sub+=`<span class="banner warn" style="margin-top:6px"><span class="ic">?</span><span>The connection dropped while this lot was being added, so it may or may not exist. ${r.checking?`<b>Checking InvenTree for import reference ${esc(r.ref)}…</b>`:`<b>Couldn’t confirm yet.</b> To avoid a duplicate, nothing will be added again until this is settled.`}<br>${r.checking?"":`<span class="row" style="margin-top:6px"><button class="btn sm" data-a="checkagain" data-id="${r.id}">Check again</button><a class="btn sm ghost" href="https://inventree.example/stock/?search=${esc(r.ref)}" target="_blank" rel="noopener">Look in InvenTree ↗</a><button class="btn sm ghost" data-a="notadded" data-id="${r.id}">I checked — it wasn’t added</button></span>`}</span></span>`;
    return `<div class="rrow">${ic}<div><b>${esc(i.title)}</b> <span class="muted small num">${esc(String(i.lot.qty.v))} pcs</span><div class="sub">${sub}</div></div>${right}</div>`}).join("")}</div>
  <details class="act"><summary>Activity and technical details</summary><div class="log">${im.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div></details>
  </div>`;
}

/* evidence viewer */
function viewer(){
  const v=UI.viewer,b=M(),img=v.img,ph=PH[img];
  const it=v.item?itemById(v.item):null;
  const out=it&&v.out?it.outputs.find(o=>o.id===v.out):null;
  const draft=v.crop;
  const reg=b.regions[img]||{};
  const supports=b.items?b.items.filter(i=>i.ev.includes(img)):[];
  const overlay=draft?`<g><path d="M0 0H${ph.w}V${ph.h}H0Z M${draft[0]} ${draft[1]}v${draft[3]}h${draft[2]}v${-draft[3]}Z" fill="rgba(0,0,0,.5)" fill-rule="evenodd"/><rect id="cropbox" x="${draft[0]}" y="${draft[1]}" width="${draft[2]}" height="${draft[3]}" fill="transparent" stroke="#ffd34d" stroke-width="2" style="cursor:move"/>${[[0,0],[1,0],[0,1],[1,1]].map(([a,c])=>`<rect class="hdl" data-h="${a}${c}" x="${draft[0]+a*draft[2]-6}" y="${draft[1]+c*draft[3]-6}" width="12" height="12" fill="#ffd34d" style="cursor:${a===c?"nwse":"nesw"}-resize"/>`).join("")}</g>`:Object.entries(reg).map(([k,r])=>`<g><rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" fill="none" stroke="${k===v.item?"#ffd34d":"rgba(255,255,255,.7)"}" stroke-width="2" stroke-dasharray="${k===v.item?"":"6 4"}" rx="4"/><rect x="${r[0]}" y="${r[1]-14}" width="${Math.min(r[2],itemById(k).title.length*5.2+8)}" height="14" fill="rgba(0,0,0,.7)"/><text x="${r[0]+4}" y="${r[1]-4}" font-size="9" fill="#fff" font-family="sans-serif">${esc(itemById(k).title)}</text></g>`).join("");
  const outs=b.items?b.items.flatMap(i=>i.outputs.filter(o=>o.img===img).map(o=>({i,o}))):[];
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Evidence viewer" data-a="closebg"><div class="dialog">
  <div class="dh"><h2 style="flex:1">${esc(ph.name)}</h2>${out?`<span class="pill acc">Editing crop: ${esc(out.target)} · ${esc(it.title)}</span>`:""}<button class="btn sm ghost" data-a="closeviewer" aria-label="Close">✕ Close</button></div>
  <div class="db viewer">
    <div style="display:flex;flex-direction:column;min-width:0">
      <div class="vtools" role="toolbar" aria-label="View"><button class="btn sm" data-a="zoom" data-d="0.25" aria-label="Zoom in">＋</button><button class="btn sm" data-a="zoom" data-d="-0.25" aria-label="Zoom out">−</button><span class="small muted num" style="min-width:42px;text-align:center">${Math.round(v.zoom*100)}%</span><button class="btn sm" data-a="rot" aria-label="Rotate 90 degrees">⟳ Rotate</button><span class="sp"></span>${out?`<button class="btn sm ghost" data-a="cropreset">Reset crop</button><button class="btn sm primary" data-a="cropsave">Save crop</button>`:`<span class="small muted">Original — never altered</span>`}</div>
      <div class="vstage"><div class="canvas" style="transform:scale(${v.zoom}) rotate(${out?0:v.rot}deg)"><svg id="vsvg" viewBox="0 0 ${ph.w} ${ph.h}" style="width:${ph.doc?"min(420px,100%)":"min(720px,100%)"}" role="img" aria-label="${esc(ph.name)}">${PHB[img]}${overlay}</svg></div></div>
      ${out?`<p class="small muted" style="padding:6px 12px;margin:0">Drag the box to move it, drag a corner to resize. The original photo stays as it is.</p>`:""}
      <div class="vstrip" role="group" aria-label="All evidence">${(B().evidence||[]).map(e=>`<button class="btn sm ghost" style="padding:2px" data-a="viewer" data-img="${e}" ${v.item?`data-item="${v.item}"`:""} aria-pressed="${e===img}" title="${esc(PH[e].name)}"><span class="thumb" style="display:block;${e===img?"outline:2px solid var(--accent)":""}">${pic(e)}</span></button>`).join("")}</div>
    </div>
    <div class="vside">
      ${out?`<div class="sec"><span class="label">Result</span><div class="preview" style="margin-top:6px"><svg viewBox="${draft.join(" ")}" preserveAspectRatio="xMidYMid meet" style="transform:rotate(${v.rot}deg)">${PHB[img]}</svg></div><p class="small" style="margin:6px 0 0">Attached as <b>${esc(out.target)}</b> ${out.target==="Part image"?"on Part "+esc(partOf(it).ipn):"on the stock item"}.</p><div class="row" style="margin-top:6px"><button class="btn sm" data-a="rot">⟳ Rotate result</button></div></div>`:""}
      ${(()=>{const vb=B();ensureGroups(vb);const g=vb.groups.find(x=>x.ev.includes(img));return `<div class="sec"><label class="label" for="vnote-${img}">Note on this ${ph.doc?"document":"photo"}</label>${g?`<div class="small muted" style="margin-top:4px">In group <b>${esc(g.name)}</b>${g.note?`: ${esc(g.note)}`:""}</div>`:`<div class="small muted" style="margin-top:4px">Not in a group</div>`}<textarea id="vnote-${img}" data-c="evnote" data-img="${img}" style="margin-top:6px;min-height:60px" placeholder="Add a note about this ${ph.doc?"document":"photo"}">${esc(vb.evNotes[img]||"")}</textarea></div>`})()}
      ${b.items&&B().items?`<div class="sec"><span class="label">This photo supports</span><div class="assign" style="margin-top:6px">${b.items.map(i=>`<label><input type="checkbox" data-c="assign" data-id="${i.id}" data-img="${img}" ${i.ev.includes(img)?"checked":""}> ${esc(i.title)}</label>`).join("")}</div><p class="small muted" style="margin:6px 0 0">Untick to remove it from an item, tick to use it as evidence for another. Grouping mistakes are fixed here.</p></div>
      <div class="sec"><span class="label">Images made from this photo</span><div class="stack" style="margin-top:6px;gap:6px">${outs.map(({i,o})=>`<button class="doc" style="cursor:pointer;background:${out&&o.id===out.id?"var(--accent-weak)":"var(--surface)"};text-align:left" data-a="viewer" data-img="${img}" data-item="${i.id}" data-out="${o.id}"><span class="thumb" style="width:40px;height:30px">${cropSvg(o)}</span><span style="flex:1"><b>${esc(o.target)}</b> → ${esc(i.title)}${i.cropIssue&&o===i.outputs[0]?`<br><span style="color:var(--warn)">▢ Cuts off a lead</span>`:""}</span></button>`).join("")||`<span class="small muted">None</span>`}</div></div>`:""}
      <div class="sec"><span class="label">Read from this file</span><ul class="small" style="margin:6px 0 0;padding-left:18px">${supports.map(i=>`<li>${esc(i.title)}: ${esc(partOf(i).mpn.v)}, ${esc(String(i.lot.qty.v))} pcs</li>`).join("")}</ul></div>
    </div>
  </div></div></div>`;
}
function compareModal(){
  const it=itemById(UI.compare),p=partOf(it);
  const prop={ipn:"New Part",name:p.desc.v,mpn:p.mpn.v,mfr:p.mfr.v,pkg:(p.params.find(x=>/Package/.test(x[0]))||[0,{v:"—"}])[1].v,stock:"—",note:"Proposed from evidence"};
  const cols=[prop].concat(p.candidates);
  const rows=[["Manufacturer part no.","mpn"],["Manufacturer","mfr"],["Package","pkg"],["In stock","stock"],["Notes","note"]];
  const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="Compare matches" data-a="closebg"><div class="dialog" style="width:min(980px,100%)"><div class="dh"><h2 style="flex:1">Compare matches · ${esc(it.title)}</h2><button class="btn sm ghost" data-a="closecompare">✕ Close</button></div>
  <div class="db" style="padding:12px 16px"><div class="row" style="gap:10px;margin-bottom:10px"><span class="thumb" style="width:120px;height:90px">${pic(it.ev[0],it.outputs[0]?it.outputs[0].crop:null)}</span><p class="small" style="flex:1;margin:0">The worn character in the marking can’t be read directly. ≠ marks a value that differs from what the evidence shows.</p></div>
  <div class="tablewrap"><table class="cmp"><thead><tr><th></th>${cols.map((c,ix)=>`<th>${ix===0?"From evidence":`<a class="mono" href="https://inventree.example/part/${c.ipn}/" target="_blank" rel="noopener">${c.ipn} ↗</a>`}</th>`).join("")}</tr></thead><tbody>
  ${rows.map(r=>`<tr><th>${r[0]}</th>${cols.map((c,ix)=>{const same=ix>0&&["mpn","mfr","pkg"].includes(r[1])?(norm(c[r[1]]).startsWith(norm(prop[r[1]]).slice(0,6))&&(r[1]!=="mpn"||norm(c[r[1]])===norm(prop[r[1]]))):null;return `<td class="${same===null?"":same?"same":"diff"}">${esc(c[r[1]])}</td>`}).join("")}</tr>`).join("")}
  <tr><th></th>${cols.map((c,ix)=>`<td>${ix===0?`<button class="btn sm" data-a="pickmatch" data-id="${it.id}" data-v="new">Create new Part</button>`:`<button class="btn sm primary" data-a="pickmatch" data-id="${it.id}" data-v="${c.ipn}">Use ${c.ipn}</button>`}</td>`).join("")}</tr>
  </tbody></table></div></div></div></div>`;
}

/* design notes */
function notes(){
  return `<div class="notes">
  <div><span class="label">Design notes</span><h1 style="font-size:26px;margin-top:4px">Is reviewing a proposal easier than typing it in?</h1><p class="muted">That question shaped every screen. Typing a stock lot into InvenTree by hand means about 18 fields across Part, manufacturer part, supplier part and stock item, plus uploads. Here the work becomes checking a highlighted value against the photo it came from and correcting the few that are wrong.</p></div>
  <div class="card"><h2>Information architecture</h2>
    <div class="ia"><div><b>Batches</b><br><span class="small muted">Home. Continue card first, then every batch with state and counts. No statistics.</span></div><div><b>Batch › Capture</b><br><span class="small muted">One intake surface: photos, documents, notes, order number, shared details. Open at any stage.</span></div><div><b>Batch › Processing</b><br><span class="small muted">Each phase expands to show what it produced: files read, the evidence map, sources, images and inventory matches. Questions sit in the phase that raised them.</span></div><div><b>Batch › Review</b><br><span class="small muted">Workspace or table. Questions appear inline on their item.</span></div><div><b>Processing › step pages</b><br><span class="small muted">Reading · Identifying · Research · Images · Inventory. Each shows its status and results and lets you correct that step’s output.</span></div><div><b>Batch › Approve</b><br><span class="small muted">Pick reviewed items; see every record that will change.</span></div><div><b>Batch › Results</b><br><span class="small muted">Per-lot outcomes, links, targeted fixes, activity log.</span></div></div>
    <p>The batch is the unit of work, and its tabs follow the workflow without locking it: you can add evidence from Review, and answer questions from Processing. Launched from InvenTree, a plugin opens a new batch (from a purchase order or a stock location) or the Batches list. The header keeps an “Open InvenTree” link and uses InvenTree’s nouns: Part, stock lot, location, supplier part.</p></div>
  <div class="card"><h2>Two approaches to the review workspace</h2>
    <div class="vs"><div><div class="mini" style="grid-template-columns:1fr 2fr 1.6fr"><span></span><span></span><span></span></div><b>A. Workspace (item list · evidence · details)</b><p class="small">Best for checking one item properly: every claim sits next to the photo it came from, questions appear in place, and keyboard movement is quick. Weaker for spotting a wrong date code across twelve rows.</p></div>
    <div><div class="mini" style="grid-template-rows:repeat(5,1fr)"><span></span><span></span><span></span><span></span><span></span></div><b>B. Table with bulk edit</b><p class="small">Best for many similar items: scan a column, select rows, set location or date code with the scope stated (“Apply to 3”). Overrides are marked ◆ per cell. Evidence is one click away rather than always visible, so it’s weaker for uncertain items.</p></div></div>
    <p><b>Recommendation:</b> start in the Workspace and switch to the Table for batches of similar items. Both share selection, filters and edits, so switching doesn’t lose your place. On a phone the workspace becomes list → item, with evidence above the fields.</p></div>
  <div class="card"><h2>Main decisions</h2><ul>
    <li><b>Part and stock lot are separate sections.</b> The Part section says when it’s shared (“Shared by 2 stock lots — edits apply to all”) and lists each lot’s quantity and date code.</li>
    <li><b>Every important value carries its source.</b> A chip such as “Packet label · Label and slip agree” or “Handwriting · Estimate”. Clicking it opens the photo. Uncertainty is described in words (“Likely — check”, “Sources disagree”), never as a percentage.</li>
    <li><b>Corrections are sticky.</b> An edited value is underlined and its chip changes to “You · Your edit”. Rechecks skip it and say how many edits were kept.</li>
    <li><b>Approval is tied to what was reviewed.</b> Editing a reviewed item sends it back to “Needs review again”, and a Part edit affects every lot that uses it. The button names the scope: “Approve 8 items and add to InvenTree”.</li>
    <li><b>Evidence groups carry what you know at the bench.</b> Photos that belong together, such as the front and back of one packet, go in a group at capture. Each group and each photo takes a note. Notes are read during processing and shown beside the photo in review and in the viewer. Groups are hints, so one photo can still support several items.</li>
    <li><b>Review is organised by InvenTree record.</b> Each item shows a chain from Category through Part, Manufacturer part, Supplier part, optional Purchase order and Stock item to Location. Every level says whether it already exists, will be created, or will be updated, and expands to show its fields, image, attachments and parameters. Existing values are never overwritten unless you choose “Use proposed” for that field.</li>
    <li><b>Images show their processing.</b> Each proposed image shows the original with the crop outlined and a before/after slider, the steps applied, and where it will be attached. Part images become the Part’s picture; stock photos are attachments, because stock items show the Part image. You can ask for a change to one image and pick between the two versions.</li>
    <li><b>The evidence map explains the proposal.</b> Processing shows which file contributed what to each item, flags files that weren’t used and items resting on thin evidence, and links to the viewer for corrections.</li>
    <li><b>Problems are sorted by what they stop.</b> Blocking problems (Part not chosen, sources disagree, possible duplicate stock, quantity missing or unconfirmed) must be fixed before an item can be approved. Warnings (unknown maker, maker not confirmed, part not fully identified, no datasheet, estimated quantity, a bad crop) can be fixed or dismissed with a reason; an item can’t be marked reviewed while any are open. Dismissed warnings are listed in the approval and kept in the stock item’s notes.</li>
    <li><b>Two levels of navigation.</b> The top level stays Capture · Processing · Review · Approve · Results. Processing has an overview and one page per step, where batch-wide corrections happen (fix a transcription, add a source, map a new location to an existing one). Review stays organised by item, and both edit the same data.</li>
    <li><b>Background work is visible everywhere.</b> A compact indicator in the header shows what’s running, with one segment per step rather than a single percentage. It opens a panel with each job’s steps, what’s ready, what needs you, and a link to it.</li>
    <li><b>Ready items don’t wait for the rest.</b> Questions can be deferred; open items stay in the batch, which then shows Partly complete.</li>
    <li><b>Processing shows phases and outcomes, not a percentage.</b> Items appear as they’re found, and the number of items isn’t known until the labels are read.</li>
    <li><b>Partial results are precise.</b> A failed attachment gets “Retry attachment”. An uncertain stock lot is checked by its import reference and never offers a plain retry that could duplicate stock.</li>
    <li><b>Status never relies on colour alone.</b> Each pill has a glyph and a word, focus rings are visible, and the main actions stay in sticky footers.</li>
  </ul></div>
  <div class="card"><h2>Try these in the prototype</h2><ul class="small">
    <li>Capture: drag a photo into another group, tick two photos and use <i>Group 2 selected</i>, or add a note to a photo or group.</li>
    <li>Review › Warnings filter: dismiss “No datasheet found” on the USB-C receptacle with a reason, then mark it reviewed.</li>
    <li>Processing › Finding supporting information: click a datasheet or supplier page to see the saved snapshot and the values taken from it.</li>
    <li>Review › ATmega328P: answer the question or use <i>Compare side by side</i>.</li>
    <li>Processing: expand <i>Identifying components</i> and select the bench bag photo in the evidence map to see the three items it feeds.</li>
    <li>Processing › Images › 16 MHz crystal: <i>Ask for a change</i> → “Include the leads”, then keep v2.</li>
    <li>Review › 100 nF capacitor: open the Part level to see existing vs proposed values, and try <i>Use proposed</i> on the description.</li>
    <li>Review › 16 MHz crystal: <i>Adjust crop</i>, drag a corner, then <i>Save crop</i>.</li>
    <li>Review › 10 kΩ packet A: edit the manufacturer part number, then check Approve. Both resistor lots now need review again.</li>
    <li>Table: tick 3 rows and set Location → a per-item override appears.</li>
    <li>Approve, then Results: <i>Retry attachment</i>. Set State → “Import: uncertain result” before approving to see the checking state.</li>
    <li>Choose State → Processing in progress, then move to another tab: the header indicator keeps the progress in view. Prototype bar also has: Phone, Empty, Loading, InvenTree unreachable, Resumed session.</li></ul>
    <div class="row"><button class="btn primary" data-a="open" data-id="b1" data-tab="review">Open the review workspace</button></div></div>
  </div>`;
}

  b.imp={running:true,rows:sel.map(id=>{const it=itemById(id),p=partOf(it);const lots=lotsOfPart(it.part).filter(l=>sel.includes(l.id));return {id,st:"queued",stockId:ids[id]||1860,ref:"IMP-3381-"+String(ids[id]%100).padStart(2,"0"),partId:p.ipn.replace(" (new)",""),sharedNote:lots.length>1?"shared with "+(lots.length-1)+" other lot in this batch":"",att:it.outputs.filter(o=>!o.declined&&!(o.target==="Part image"&&(lots[0]!==it||(p.mode==="reuse"&&p.existing&&p.existing.image&&p.imageChoice!=="replace")))).map(o=>({n:o.target==="Part image"?"Part image":"Stock attachment",st:"ok"})).concat(p.docs.map(d=>({n:d.n.replace(/ \(.*\)/,"")+" PDF",st:"ok"})))}}),po:b.shared.po?"PO-0231":null,log:[stamp()+" approval a7f3c2 by mitch · "+sel.length+" items · proposal rev 14"].concat(b.shared.po?[stamp()+" POST /api/order/po/ supplier=Mouser ref=3381-22 → 201 PO-0231"]:[])};
  const r6=b.imp.rows.find(r=>r.id==="i6");
  UI.tab="results";render();
  let k=0;
  const step=()=>{const r=b.imp.rows[k];if(!r){b.imp.running=false;b.imp.finished=true;b.imp.log.push(stamp()+" import job 5521 finished: "+b.imp.rows.filter(x=>x.st==="added").length+" stock created, 1 attachment failed");touch();render();return}
    r.st="adding";render();
    setTimeout(()=>{
      const it=itemById(r.id),p=partOf(it);
      if(p.mode==="new"&&!b.imp.rows.slice(0,k).some(x=>itemById(x.id).part===it.part))b.imp.log.push(stamp()+" POST /api/part/ → 201 "+r.partId);
      if(r.id==="i9"){r.st="uncertain";r.checking=true;b.imp.log.push(stamp()+" POST /api/stock/ ref="+r.ref+" → connection reset (no response)");render();
        setTimeout(()=>{r.checking=false;if(UI.scenario!=="uncertain"){r.st="added";it.status="added";b.imp.log.push(stamp()+" GET /api/stock/?search="+r.ref+" → found id="+r.stockId+" (created before reset)")}else b.imp.log.push(stamp()+" GET /api/stock/?search="+r.ref+" → timeout");k++;render();setTimeout(step,350)},2200);return}
      r.st="added";it.status="added";
      b.imp.log.push(stamp()+" POST /api/stock/ part="+r.partId+" qty="+it.lot.qty.v+" ref="+r.ref+" → 201 id="+r.stockId);
      if(r.id==="i6"){const a=r.att.find(x=>/PDF/.test(x.n));a.st="failed";a.why="ecsxtal.com returned 403 when downloading";b.imp.log.push(stamp()+" GET https://ecsxtal.com/…/ECS-160-20-4X.pdf → 403 Forbidden");}
      k++;render();setTimeout(step,450)},650)};
  setTimeout(step,400);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{if(UI.actOpen&&!e.target.closest("#activity")){UI.actOpen=false;renderActivity()}const el=e.target.closest("[data-a]");if(!el)return;const fn=A[el.dataset.a];if(!fn)return;if(el.tagName==="A")return;if(el.dataset.a!=="closebg")e.preventDefault();fn(el.dataset,e,el)});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("src")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();A.src(t.dataset);return}
  if(e.key==="Escape"){if(UI.actOpen){UI.actOpen=false;renderActivity();return}if(UI.editing){UI.editing=null;render()}else if(UI.viewer||UI.compare||UI.source){UI.viewer=null;UI.compare=null;UI.source=null;render()}return}
  if(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||UI.viewer||UI.compare||UI.source)return;
  if(UI.view!=="batch"||UI.tab!=="review"||!M().items)return;
  const k=e.key.toLowerCase();
  if(k==="j"||k==="arrowdown"){e.preventDefault();A.nav({d:1})}
  else if(k==="k"||k==="arrowup"){e.preventDefault();A.nav({d:-1})}
  else if(k==="r"){const it=itemById(UI.item);if(it.status==="ready")A.reviewed({id:it.id})}
  else if(k==="v"){const it=itemById(UI.item);A.viewer({img:UI.evSel[it.id]||it.ev[0],item:it.id})}
  else if(k==="e"){e.preventDefault();A.edit({id:UI.item,scope:"lot",key:"qty"})}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
  if(f.dataset.f==="readsave"){const b=M();b.readEdits=b.readEdits||{};const t=f.t.value.trim();if(t===(READ[f.dataset.img]||""))delete b.readEdits[f.dataset.img];else b.readEdits[f.dataset.img]=t;recheckFile(b,f.dataset.img,"Text saved.");return}
  if(f.dataset.f==="srcadd"){const u=f.u.value.trim();if(!u){f.u.focus();return}const it=itemById(f.dataset.id),p=partOf(it);const host=u.replace(/^https?:\/\//,"").split("/")[0].replace(/^www\./,"")||u;
    if(/\.pdf($|\?)|datasheet/i.test(u)){p.docs.push({n:`Datasheet (${host})`,kind:"PDF"});markChanged(it,"part");toast("Datasheet added to the Part.")}
    else{it.extraSrc=(it.extraSrc||[]).concat({kind:"web",title:host+" page",host,url:/^https?:/.test(u)?u:"https://"+u,facts:[],level:"part"});toast("Source added. Values it confirms will be listed once it’s read.")}
    UI.srcAdd=null;touch();render();return}
  if(f.dataset.f==="dismiss"){snapshot();const it=itemById(f.dataset.id);it.dismissed=it.dismissed||{};it.dismissed[f.dataset.i]={reason:[UI.dReason,(UI.dText||"").trim()].filter(Boolean).join(" — "),at:Date.now()};UI.dismissing=null;touch();toast("Warning dismissed",true);render();return}
  if(f.dataset.f==="feedback"){const oid=f.dataset.o;const {it,o}=findOut(oid);const chips=UI.fbChips[oid]||[];const t=(UI.fbText[oid]||"").trim();if(!chips.length&&!t){toast("Pick a change or describe it");render();return}reprocess(it,o,chips,t);return}
  if(f.dataset.f==="saveedit"){const v=f.v.value.trim();const ed=UI.editing;const it=itemById(ed.item);const cur=getF(it,ed.scope,ed.key);if(!cur||String(cur.v)!==v){setF(it,ed.scope,ed.key,v);const shared=(ed.scope==="part"||ed.scope==="param")&&lotsOfPart(it.part).length>1;toast(shared?`Updated the shared Part — affects ${lotsOfPart(it.part).length} stock lots`:"Saved")}UI.editing=null;render()}
  if(f.dataset.f==="recheck"){const q=f.q.value.trim();const it=itemById(f.dataset.id);runRecheck(it,q)}
});
function runRecheck(it,q){
  const p=partOf(it);const kept=[p.desc,p.mfr,p.mpn,p.cat,...p.params.map(x=>x[1]),it.lot.qty,it.lot.dc].filter(f=>f&&f.edited).length;
  const phases=["Reading the logo and packet label again…","Checking the manufacturer’s site…","Comparing with existing inventory…"];
  let i=0;UI.recheck={item:it.id,phase:phases[0]};render();
  const iv=setInterval(()=>{i++;if(i<phases.length){UI.recheck.phase=phases[i];render()}else{clearInterval(iv);UI.recheck=null;
    if(!p.mfr.edited&&/manufacturer|logo/i.test(q||"")&&p.mfr.cert==="likely"){p.mfr=Object.assign({},p.mfr,{cert:"agree",note:"Logo matched on recheck: "+(q||"")})}
    if(!it.lot.qty.edited&&/packet|label|quantity/i.test(q||"")&&it.lot.qty.cert==="guess"){it.lot.qty=Object.assign({},it.lot.qty,{note:"Rechecked: label gives no firmer count"})}
    touch();toast(`Rechecked ${it.title}. ${kept?`Kept your ${kept} edit${kept>1?"s":""}.`:"No changes to your edits."}`);render()}},1100);
}
document.addEventListener("change",e=>{const el=e.target,c=el.dataset.c;if(!c)return;const b=B();
  if(c==="scenario"){UI.scenario=el.value;if(el.value==="processing"){startSim();render();return}UI.sim=null;UI.offlineDismiss=false;if(el.value==="resumed"){UI.dismissResume=false;UI.view="inbox"}if(["empty","loading"].includes(el.value)&&UI.view!=="batch")UI.view="inbox";render()}
  else if(c==="note"){b.note=el.value;touch();save()}
  else if(c==="order"){b.order=el.value;save()}
  else if(c==="shared"){b.shared[el.dataset.k]=el.value;touch();toast("Shared "+el.dataset.k+" updated for items without an override");render()}
  else if(c==="po"){b.shared.po=el.checked;touch();toast(el.checked?"A purchase order will be created for this batch":"No purchase order will be created");render()}
  else if(c==="mapnew"){const v=el.value,from=el.dataset.v,k=el.dataset.kind;if(!v)return;const b=M();
    if(k==="loc")b.items.filter(i=>locOf(i)===from).forEach(i=>setF(i,"lot","loc",v));
    else Object.keys(b.parts).forEach(pk=>{const p=b.parts[pk];if(k==="cat"&&p.cat.v===from&&p.catExists===false){p.cat=Object.assign(F(v,"user","set"),{edited:true});p.catExists=true;const l=lotsOfPart(pk)[0];if(l)markChanged(l,"part")}
      if(k==="co"&&p.mfr.v===from&&p.mfrExists===false){p.mfr=Object.assign(F(v,"user","set"),{edited:true});p.mfrExists=true;delete p.newCompany;const l=lotsOfPart(pk)[0];if(l)markChanged(l,"part")}});
    touch();toast(`“${from}” now maps to the existing “${v}”. Nothing new will be created for it.`);render()}
  else if(c==="addfiles"){addFiles(b,el.files,el.dataset.g||null);el.value=""}
  else if(c==="cappick"){const id=el.dataset.img;UI.capSel=el.checked?UI.capSel.concat(id):UI.capSel.filter(x=>x!==id);render()}
  else if(c==="qphoto"){toast("Photo added to "+itemById(el.dataset.id).title+". Reading it now…");render()}
  else if(c==="assign"){const it=itemById(el.dataset.id);if(el.checked){if(!it.ev.includes(el.dataset.img))it.ev.push(el.dataset.img)}else{it.ev=it.ev.filter(x=>x!==el.dataset.img);if(!it.ev.length){it.ev=[el.dataset.img];el.checked=true;toast("An item needs at least one piece of evidence");render();return}}if(it.reviewed){it.reviewed=false;it.changedAfterReview="evidence changed after review"}touch();toast(el.checked?"Now used as evidence for "+it.title:"Removed from "+it.title);render()}
  else if(c==="selrow"){const id=el.dataset.id;UI.tableSel=el.checked?UI.tableSel.concat(id):UI.tableSel.filter(x=>x!==id);render()}
  else if(c==="selall"){UI.tableSel=el.checked?visItems(M()).map(i=>i.id):[];render()}
  else if(c==="apsel"){const id=el.dataset.id;UI.approveSel=el.checked?UI.approveSel.concat(id):UI.approveSel.filter(x=>x!==id);render()}
});

document.addEventListener("input",e=>{const el=e.target,c=el.dataset&&el.dataset.c;if(!c||UI.view!=="batch")return;const b=B();ensureGroups(b);
  if(c==="gnote"||c==="gname"){const g=b.groups.find(x=>x.id===el.dataset.g);if(g){g[c==="gnote"?"note":"name"]=el.value;touch();save()}}

window.addEventListener("resize",()=>drawMap());

document.addEventListener("dragstart",e=>{const t=e.target.closest&&e.target.closest("[data-drag]");if(!t)return;e.dataTransfer.setData("text/plain",t.dataset.drag);e.dataTransfer.effectAllowed="move"});
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("[data-drop]");if(!z)return;e.preventDefault();document.querySelectorAll(".egroup.over").forEach(x=>{if(x!==z)x.classList.remove("over")});z.classList.add("over")});

  if(e.dataTransfer.files&&e.dataTransfer.files.length){addFiles(B(),e.dataTransfer.files,gid);return}
  const id=e.dataTransfer.getData("text/plain");if(!id)return;const ids=UI.capSel.includes(id)?UI.capSel.slice():[id];moveEv(ids,z.dataset.drop)});
document.addEventListener("dragend",()=>document.querySelectorAll(".egroup.over").forEach(x=>x.classList.remove("over")));
/* crop dragging */
let drag=null;
document.addEventListener("pointerdown",e=>{if(!UI.viewer||!UI.viewer.crop)return;const t=e.target;if(!(t.id==="cropbox"||t.classList.contains("hdl")))return;const svg=document.getElementById("vsvg");const pt=svgPt(svg,e);drag={mode:t.id==="cropbox"?"move":t.dataset.h,start:pt,orig:UI.viewer.crop.slice(),svg};t.setPointerCapture&&t.setPointerCapture(e.pointerId);e.preventDefault()});
document.addEventListener("pointermove",e=>{if(!drag)return;const pt=svgPt(drag.svg,e);const dx=pt.x-drag.start.x,dy=pt.y-drag.start.y;const ph=PH[UI.viewer.img];let [x,y,w,h]=drag.orig;
  if(drag.mode==="move"){x=Math.max(0,Math.min(ph.w-w,x+dx));y=Math.max(0,Math.min(ph.h-h,y+dy))}
  else{const ax=drag.mode[0]==="1",ay=drag.mode[1]==="1";if(ax)w=Math.max(20,Math.min(ph.w-x,w+dx));else{const nx=Math.max(0,Math.min(x+w-20,x+dx));w=w+(x-nx);x=nx}if(ay)h=Math.max(20,Math.min(ph.h-y,h+dy));else{const ny=Math.max(0,Math.min(y+h-20,y+dy));h=h+(y-ny);y=ny}}
  UI.viewer.crop=[x,y,w,h];updateCropDom()});
document.addEventListener("pointerup",()=>{if(drag){drag=null;render()}});
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function updateCropDom(){const c=UI.viewer.crop,ph=PH[UI.viewer.img];const box=document.getElementById("cropbox");if(!box)return;box.setAttribute("x",c[0]);box.setAttribute("y",c[1]);box.setAttribute("width",c[2]);box.setAttribute("height",c[3]);
  box.previousElementSibling.setAttribute("d",`M0 0H${ph.w}V${ph.h}H0Z M${c[0]} ${c[1]}v${c[3]}h${c[2]}v${-c[3]}Z`);
  document.querySelectorAll(".hdl").forEach(hd=>{const a=+hd.dataset.h[0],b=+hd.dataset.h[1];hd.setAttribute("x",c[0]+a*c[2]-6);hd.setAttribute("y",c[1]+b*c[3]-6)});
  const pv=document.querySelector(".preview svg");if(pv)pv.setAttribute("viewBox",c.join(" "))}

render();
